
package:
  name: pssparser
  version: 0.0.1

  setup-deps:
  - ninja
  - cython
  - ivpm-build

  dep-sets:
  - name: default-dev
    deps:
    - name: antlr4-tools.jar
      url: https://www.antlr.org/download/antlr-4.13.2-complete.jar
    - name: antlr4-cpp-runtime
      url: https://www.antlr.org/download/antlr4-cpp-runtime-4.13.2-source.zip
    # 1.15.2, not the 1.10.0 that stood here. 1.10.0 declares
    # `cmake_minimum_required(VERSION 2.8.8)`, and CMake 4 removed
    # compatibility with < 3.5 outright -- the manylinux image picked up
    # CMake 4.4 and every job died in the GTEST configure step. Raising the
    # policy floor with -DCMAKE_POLICY_VERSION_MINIMUM=3.5 gets past configure
    # and then fails in the compile: 1.10.0 builds itself with -Werror, and
    # gcc >= 13 reports -Wmaybe-uninitialized in gtest-death-test.cc. Moving
    # the dependency forward fixes both at once; 1.15.2 requires CMake 3.13
    # and C++14, and this project is already on C++17.
    - name: gtest
      url: https://github.com/google/googletest/archive/refs/tags/v1.15.2.tar.gz
    - name: pyastbuilder
      url: https://github.com/mballance-utils/pyastbuilder.git
    - name: ciostream
      src: pypi
    - name: debug-mgr
      src: pypi
    - name: pytest
      src: pypi
    - name: toposort
      src: pypi
    - name: ninja
      src: pypi
    - name: cython
      src: pypi
    - name: ivpm-build
      src: pypi

    # The shared .pss corpus (pss-corpus/PLAN.md, C-17). Test data: `type: raw`
    # because there is nothing to build and nothing to install.
    #
    # `default-dev` only, deliberately. This is the lowest repository in the
    # stack and the one whose artefacts ship; a released wheel has no business
    # carrying test data, and nothing under python/ or src/ reads it. The
    # answer to CQ-3 is that pssparser depends on the corpus the way it depends
    # on gtest -- as a developer, never as a package.
    #
    # URL names the GitHub mirror rather than the git.dvkit.org upstream,
    # matching every other source dependency in this file; the Forgejo CI
    # remaps psstools/ to git.dvkit.org, as it already does for the rest. Note
    # the mirror does not exist yet (pss-corpus PLAN.md C-2a), so an unmapped
    # `ivpm update -d default-dev` cannot resolve it today -- which is why the
    # CI jobs clone it directly rather than relying on this entry.
    - name: pss-corpus
      url: https://github.com/psstools/pss-corpus.git
      type: raw

  - name: default
    deps:
    - name: ciostream
      src: pypi
    - name: pyastbuilder
      src: pypi
    - name: antlr4-tools.jar
      url: https://www.antlr.org/download/antlr-4.13.2-complete.jar
    - name: antlr4-cpp-runtime
      url: https://www.antlr.org/download/antlr4-cpp-runtime-4.13.2-source.zip
    - name: debug-mgr
      src: pypi
    - name: ivpm-build
      src: pypi
    - name: cython
      src: pypi
    - name: ninja
      src: pypi
