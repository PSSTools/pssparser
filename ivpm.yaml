
package:
  name: pssparser
  version: 0.0.1

  setup-deps:
  - ninja
  - cython
  - ivpm-build

  dep-sets:
  - name: default-dev
    deps:
    - name: antlr4-tools.jar
      url: https://www.antlr.org/download/antlr-4.13.2-complete.jar
    - name: antlr4-cpp-runtime
      url: https://www.antlr.org/download/antlr4-cpp-runtime-4.13.2-source.zip
    # No gtest. The C++ test executable was retired on 2026-08-31 (see the note
    # at the foot of CMakeLists.txt): the suite is pytest, and gtest was a
    # source dependency that had to be fetched and built by every developer and
    # every CI job to cover rules the Python tests already cover.
    - name: pyastbuilder
      url: https://github.com/mballance-utils/pyastbuilder.git
    - name: ciostream
      src: pypi
    - name: debug-mgr
      src: pypi
    - name: pytest
      src: pypi
    - name: toposort
      src: pypi
    - name: ninja
      src: pypi
    - name: cython
      src: pypi
    - name: ivpm-build
      src: pypi

    # The shared .pss corpus (pss-corpus/PLAN.md, C-17). Test data: `type: raw`
    # because there is nothing to build and nothing to install.
    #
    # `default-dev` only, deliberately. This is the lowest repository in the
    # stack and the one whose artefacts ship; a released wheel has no business
    # carrying test data, and nothing under python/ or src/ reads it. The
    # answer to CQ-3 is that pssparser depends on the corpus the way it depends
    # on pytest -- as a developer, never as a package.
    #
    # URL names the GitHub mirror rather than the git.dvkit.org upstream,
    # matching every other source dependency in this file; the Forgejo CI
    # remaps psstools/ to git.dvkit.org, as it already does for the rest. Note
    # the mirror does not exist yet (pss-corpus PLAN.md C-2a), so an unmapped
    # `ivpm update -d default-dev` cannot resolve it today -- which is why the
    # CI jobs clone it directly rather than relying on this entry.
    - name: pss-corpus
      url: https://github.com/psstools/pss-corpus.git
      type: raw

  - name: default
    deps:
    - name: ciostream
      src: pypi
    - name: pyastbuilder
      src: pypi
    - name: antlr4-tools.jar
      url: https://www.antlr.org/download/antlr-4.13.2-complete.jar
    - name: antlr4-cpp-runtime
      url: https://www.antlr.org/download/antlr4-cpp-runtime-4.13.2-source.zip
    - name: debug-mgr
      src: pypi
    - name: ivpm-build
      src: pypi
    - name: cython
      src: pypi
    - name: ninja
      src: pypi

  #**************************************************************************
  #* wasm-build -- the Emscripten toolchain for the WebAssembly build
  #*
  #* A dedicated dep-set, not part of default-dev, and deliberately so: the
  #* bundle is 298 MB, and that is not a cost a developer building only the
  #* Python extension should pay. Building the TypeScript package is:
  #*
  #*     ivpm update -d ts-build
  #*     source scripts/wasm-env.sh
  #*     emcmake cmake -S wasm -B build-wasm -DCMAKE_BUILD_TYPE=Release
  #*     cmake --build build-wasm -j
  #*
  #* `ts-build` is default-dev plus this toolchain (see below). Naming one
  #* dep-set is not a convenience -- it is the only spelling that works, and
  #* both halves of that were established by running it on a clean clone
  #* 2026-09-07:
  #*
  #*  - The wasm build is not toolchain-only. wasm/CMakeLists.txt reaches for
  #*    packages/python (to run astbuilder), packages/antlr4-tools.jar and
  #*    packages/antlr4-cpp-runtime -- all of them default-dev. `-d wasm-build`
  #*    alone configures as far as the ANTLR step and stops.
  #*  - ivpm records the requested dep-sets in packages/ivpm.json and refuses a
  #*    later run that asks for a different set ("Attempting to update with a
  #*    different dep-set than previously used"), with no CLI override. So
  #*    `-d wasm-build` first does not merely fetch too little: it leaves the
  #*    tree in a state where the ordinary `ivpm update` fails, and the way out
  #*    is to delete packages/ivpm.json.
  #*
  #* The environment (PATH, EM_CONFIG, EM_CACHE) is set by scripts/wasm-env.sh
  #* rather than by an `env:` block here. Two reasons: the manifest-level `env:`
  #* mechanism is being retired in favour of per-package export.envrc
  #* (ivpm/env-deprecation-design.md), and the script also serves a developer
  #* who installed emsdk by some other route.
  #*
  #* EM_CACHE in particular is not optional. emcc compiles sysroot libraries --
  #* libc++, libembind -- on first use, and a $HOME-relative cache is how a
  #* build ends up warm on a workstation and cold in every CI runner. Note that
  #* `cache: true` below means packages/emsdk is a *symlink* into ~/.ivpm/cache,
  #* so wasm-env.sh keeps that state in .emsdk/ at the project root rather than
  #* writing it through the symlink into storage shared with every other
  #* project on the machine.
  #**************************************************************************
  - name: wasm-build
    deps:
    # Pinned to a build hash, never to the `latest` alias: `latest` moves, and
    # a toolchain that moves under a WASM artifact turns a reproducible build
    # into a weather report. This hash is emsdk 6.0.9.
    #
    # Verified 2026-09-07: 200, 298,541,944 bytes, serving both ETag and
    # Last-Modified (which deps_source.py consumes, so `cache: true` works).
    #
    # Linux x86_64 only for now. ivpm's `match` makes the five-platform form a
    # three-line change, and the manifest below is the one that validated that
    # feature end to end -- deferring it is a scheduling choice, not a
    # technical one:
    #
    #   vars:
    #     emsdk_hash: f04ea239d533260dd1db760dd2d668d5f9a88d6b
    #     p:   { match: { on: "${{ivpm_os}}",   cases: { linux: linux, macos: mac, windows: win } } }
    #     sfx: { match: { on: "${{ivpm_arch}}", cases: { x86_64: "", arm64: "-arm64" } } }
    #     ext: { match: { on: "${{ivpm_os}}",   cases: { windows: zip }, default: tar.xz } }
    #
    # No `src:` key. It used to say `src: url`, which looks right and is not:
    # ivpm registers "url" as a source name, but PackageURL is the base class
    # the concrete fetchers derive from, and it inherits Package.update() --
    # a method that reports the package and returns success without fetching
    # anything. `ivpm update -d wasm-build` therefore printed ">> emsdk",
    # "<< emsdk (0.0s)" and exited 0 with no packages/emsdk on disk. Left out,
    # the https:// URL auto-probes to "http" and PackageHttp does the work,
    # which is how every other URL dependency in this file is written.
    - name: emsdk
      cache: true
      url: https://storage.googleapis.com/webassembly/emscripten-releases-builds/linux/f04ea239d533260dd1db760dd2d668d5f9a88d6b/wasm-binaries.tar.xz
      type: raw

  #**************************************************************************
  #* ts-build -- everything the TypeScript/WebAssembly package needs
  #*
  #*     ivpm update -d ts-build
  #*
  #* Nothing of its own -- `deps: []` is the whole point. It is `default-dev`
  #* (astbuilder, ANTLR, the Python venv) plus `wasm-build` (the Emscripten
  #* toolchain), which together are exactly the set wasm/CMakeLists.txt reaches
  #* for. Composed by `uses:` rather than by repeating the emsdk entry, so the
  #* pinned toolchain hash has one home; the two bases stay separately declared
  #* because they are separately useful -- `wasm-build` alone is the toolchain,
  #* for someone who has the rest by another route.
  #*
  #* This is also the dep-set a *consumer* names when it takes pssparser as a
  #* source dependency and expects the wasm to be rebuilt:
  #*
  #*     - name: pssparser
  #*       url: https://github.com/psstools/pssparser.git
  #*       dep-set: ts-build
  #*       deps-mode: nested
  #*       type: { node: { subdir: ts } }
  #*
  #* `deps-mode: nested` matters: without it pssparser's dependencies are
  #* flattened into the consumer's deps-dir, and wasm/CMakeLists.txt -- which
  #* resolves ANTLR relative to its own tree -- finds nothing. A consumer that
  #* only wants to *use* the parser should take the published npm package
  #* instead and carry no toolchain at all.
  #**************************************************************************
  - name: ts-build
    uses:
    - default-dev
    - wasm-build
    deps: []
