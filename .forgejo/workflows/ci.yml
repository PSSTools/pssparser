# CI for psstools/pssparser on Forgejo Actions.
#
# Linux x86_64 only, by decision (2026-07-28). macOS / Windows / aarch64 are
# out of scope -- see ~/Documents/pssparser-cicd-design.md §9.
#
# Two things differ from the GitHub workflow this was ported from, and both
# matter:
#
#  1. No third-party actions. Bare `uses:` resolves against code.forgejo.org
#     (Forgejo's DEFAULT_ACTIONS_URL), not github.com. Publishing and release
#     steps are plain shell so that GitHub is not on the critical path of a
#     release.
#  2. Dependencies resolve from git.dvkit.org, not github.com. See the
#     "Configure ivpm" step for why it is not the in-network Forgejo URL.
name: CI

on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  # ---------------------------------------------------------------------- #
  # The release-authority master switch. Resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job, so the value has
  # to arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error -- the publish condition is then
  # false forever, nothing publishes, and nothing goes red. That is the
  # quietest failure available here, so the shadow check in
  # .forgejo/workflows/ci.yml asserts the wiring explicitly.
  # ---------------------------------------------------------------------- #
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # FAIL CLOSED WHEN A RELEASE COULD ACTUALLY HAPPEN, and quietly
            # otherwise. In this org a release is a `v*` TAG, so that -- not
            # the event name -- is the test. Keying on the event name would be
            # wrong in both directions: a tag push IS a push, so it would let a
            # release through unresolved, and every ordinary push would then
            # also be treated as release-critical and fail the build.
            #
            # A release blocked by a dvkit.org outage is recoverable in ten
            # minutes. A version published twice from two forges is not: PyPI
            # lets a version be yanked, never reused, and the VS Code
            # Marketplace does not even allow the yank.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable, and this ref cannot release; continuing"
                exit 0 ;;
            esac
          fi
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"]; print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  build-linux-x86_64:
    runs-on: ubuntu-latest
    container:
      # Prebuilt: manylinux_2_28 + node (act needs it in-container for JS
      # actions) + java (ANTLR is a jar) + build tooling in every interpreter.
      # Source and rebuild instructions: .forgejo/ci-image/Dockerfile
      image: dvkit/pssparser-ci:manylinux_2_28-x86_64

    steps:
    - uses: actions/checkout@v4

    - name: Check for internal identifiers in tracked files
      # This repo is published to git.dvkit.org and mirrored to R2, so anything
      # committed here is public. Internal host names, tailnet addresses and
      # CGNAT-range IPs must not appear in tracked files -- if a build ever
      # needs one, it belongs in a repository secret, which is masked in logs.
      # Verified clean across all refs of all repos on 2026-07-28; this step
      # exists so it stays that way.
      run: |
        pattern='perch-char\.ts\.net|\.ts\.net|a9550|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]+\.[0-9]+'
        if git grep -nIE "$pattern" -- . ':!.forgejo/workflows/ci.yml' ; then
          echo "::error::internal identifier found in a tracked file (see matches above)"
          exit 1
        fi
        echo "OK: no internal identifiers in tracked files"

    - name: Stamp build version
      # Tag builds keep the clean BASE version; everything else gets a
      # .<run-id> dev suffix so ordinary pushes can never collide with a
      # release version on PyPI.
      run: |
        case "$GITHUB_REF" in
          refs/tags/*) echo "tag build -- leaving version clean" ;;
          *) sed -i 's/^SUFFIX = ""$/SUFFIX = ".'"$GITHUB_RUN_ID"'"/' python/pssparser/__version__.py ;;
        esac
        grep '^SUFFIX = ' python/pssparser/__version__.py

    - name: Configure ivpm dependency resolution
      # ivpm.yaml names github.com URLs. Remap them to git.dvkit.org so a build
      # does not depend on GitHub.
      #
      # git.dvkit.org serves anonymously, which keeps this job credential-free
      # -- including for pull requests from forks, which cannot be given
      # secrets. If an internal endpoint is ever needed here instead, put it in
      # a repository secret rather than inline: this file is public.
      run: |
        mkdir -p ~/.config/ivpm
        cat > ~/.config/ivpm/config.yaml <<'EOF'
        git-url-map:
          - from: "https://github.com/mballance-utils/"
            to:   "https://git.dvkit.org/mballance-utils/"
          - from: "https://github.com/psstools/"
            to:   "https://git.dvkit.org/psstools/"
          - from: "https://github.com/fvutils/"
            to:   "https://git.dvkit.org/fvutils/"
        git-auth:
          - host: "git.dvkit.org"
            order: ["https"]
        EOF

    - name: Fetch source dependencies
      run: |
        export IVPM_PYTHON=/opt/python/cp312-cp312/bin/python
        ${IVPM_PYTHON} -m ivpm update -j 1 -a
        echo "--- dependency origins (must not be github.com) ---"
        for d in packages/*/; do
          [ -d "$d/.git" ] && echo "  $(basename $d) <- $(git -C $d remote get-url origin)"
        done
        if grep -rl 'github\.com' packages/*/.git/config 2>/dev/null | grep -q .; then
          echo "::error::a dependency resolved to github.com; the ivpm url-map did not apply"
          exit 1
        fi

    - name: Build native core
      run: |
        export PATH=/opt/python/cp312-cp312/bin:$PATH
        mkdir -p build && cd build
        cmake .. -GNinja
        ninja

    - name: Run C++ unit tests
      # The gtest target is built by the step above (a bare `cmake ..` leaves
      # PACKAGES_DIR unset, which turns ENABLE_TESTS on).  Building it without
      # running it would let a failing DocCommentExtractor rule ship.
      run: |
        export PATH=/opt/python/cp312-cp312/bin:$PATH
        cd build
        ctest --output-on-failure

    - name: Build wheels
      run: |
        for py in cp39-cp39 cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
          echo "=== $py ==="
          /opt/python/${py}/bin/python -m build --wheel --no-isolation
        done

    - name: Audit wheels
      run: |
        for whl in dist/*.whl; do
          [ -f "$whl" ] || continue
          /opt/python/cp312-cp312/bin/auditwheel repair "$whl"
          rm "$whl"
        done
        if ls wheelhouse/*.whl >/dev/null 2>&1; then cp wheelhouse/*.whl dist; fi
        ls -la dist/

    - name: Upload wheels
      uses: forgejo/upload-artifact@v4
      with:
        name: wheels-linux-x86_64
        path: dist/*.whl
        if-no-files-found: error

    - name: Fetch the PSS corpus
      # tests/python/corpus/test_pss_corpus.py sweeps the shared corpus, and it
      # fails rather than skips when the corpus is absent (pss-corpus PLAN.md
      # C-8) -- so without this step the test job goes red at
      # test_the_corpus_is_present. That is the design working, not a bug in
      # it: a sweep that finds no files and reports success is exactly the
      # outcome the sweep exists to prevent.
      #
      # A direct clone rather than widening "Fetch source dependencies" to
      # `-d default-dev`. That step resolves the `default` set on purpose; the
      # corpus is declared dev-only (C-17/CQ-3) so no released wheel carries
      # it, and switching the whole build to the dev set to pick up 324K of
      # test data would drag the rest of the dev graph along with it.
      #
      # Cloned after that step, not before, so a corpus checkout under
      # packages/ cannot be mistaken for a dependency by its origin check.
      #
      # No `--depth 1`: the transport in front of git.dvkit.org can fall back
      # to dumb http, which has no shallow capability and fails outright rather
      # than degrading to a full clone.
      run: |
        set -eu
        git clone https://git.dvkit.org/psstools/pss-corpus.git packages/pss-corpus
        n=$(find packages/pss-corpus/curated -name '*.pss' | wc -l)
        echo "corpus: $n .pss files"
        if [ "$n" -lt 50 ]; then
          echo "::error::corpus resolved but looks wrong ($n files, expected 50+)"
          exit 1
        fi

    - name: Test against the built wheel
      # Tests run against the *installed* wheel in a clean venv, never against
      # the source tree -- that is what makes this a test of the artifact we
      # would ship rather than of the build directory.
      run: |
        for py in cp312-cp312 cp313-cp313; do
          echo "=== $py ==="
          /opt/python/${py}/bin/python -m venv /tmp/venv-${py}
          /tmp/venv-${py}/bin/pip install -q pytest dist/*${py%%-*}-*.whl
          /tmp/venv-${py}/bin/python -m pytest tests/python -q --tb=short
        done

    - name: System test
      run: |
        /opt/python/cp313-cp313/bin/python -m venv /tmp/systest
        /tmp/systest/bin/pip install -q dist/*cp313*.whl
        /tmp/systest/bin/python -c "from pssparser import Parser; p = Parser(); assert p.parses([('test.pss', 'component pss_top {}')]); print('System test PASSED')"

  docs:
    # Depends on the build job on purpose. docs/conf.py uses sphinx.ext.autodoc,
    # which imports pssparser.ast and pssparser.core -- compiled Cython
    # extensions that exist only in a built wheel, never in the source tree.
    # Building docs from a bare checkout silently yields an empty API reference
    # while still reporting success, so the wheel is a hard prerequisite.
    needs: build-linux-x86_64
    runs-on: ubuntu-latest
    container:
      image: dvkit/pssparser-ci:manylinux_2_28-x86_64

    steps:
    - uses: actions/checkout@v4

    - name: Download wheels from the build job
      uses: forgejo/download-artifact@v4
      with:
        name: wheels-linux-x86_64
        path: dist

    - name: Build HTML docs
      run: |
        P=/opt/python/cp312-cp312/bin/python
        $P -m venv /tmp/docsenv
        /tmp/docsenv/bin/pip install -q sphinx alabaster
        # Install the wheel so autodoc can import the compiled extensions.
        /tmp/docsenv/bin/pip install -q dist/*cp312*.whl
        /tmp/docsenv/bin/python -c "import pssparser.ast, pssparser.core; print('compiled extensions importable')"
        /tmp/docsenv/bin/python -m sphinx -b html docs _site 2>&1 | tee /tmp/sphinx.log
        rm -rf _site/.doctrees

    - name: Fail if autodoc could not import the package
      # Sphinx exits 0 even when every autodoc import fails, so the exit code
      # is not a sufficient check -- assert on the warnings instead.
      run: |
        n=$(grep -c "autodoc: failed to import" /tmp/sphinx.log || true)
        if [ "$n" -gt 0 ]; then
          echo "::error::$n autodoc imports failed -- the API reference would ship empty"
          grep "autodoc: failed to import" /tmp/sphinx.log | head -5
          exit 1
        fi
        echo "OK: no autodoc import failures"
        echo "documented symbols: $(grep -c "sig-name descname" _site/reference_api_docs.html || echo 0)"

    - name: Upload docs
      uses: forgejo/upload-artifact@v4
      with:
        name: docs-psstools-pssparser
        path: _site/**
        if-no-files-found: error

  publish-pypi:
    # Releases only. A tag is the deliberate act; ordinary pushes to master
    # produce dev-suffixed wheels that must never reach PyPI, because a
    # version number there can be yanked but never reused.
    #
    # THE SECOND HALF OF THIS CONDITION IS NEW (2026-08-31, plan Phase 9), and
    # tag-gating alone was not enough without it. This repository is now
    # mirrored bidirectionally with GitHub, so a tag created here appears
    # there within five minutes and a tag created there appears here. Two
    # tag-gated publishers on two forges, keyed on the same tag, race for the
    # same PyPI version -- one wins and the other fails, unpredictably, and
    # which one won is not recorded anywhere.
    #
    # `authority == 'forgejo'` resolves that from a single source of truth:
    # https://dvkit.org/.well-known/release-authority.json, generated from
    # sync-policy.toml, which pins release_authority = "forgejo" for this
    # repository. Moving the release to GitHub is then a policy edit and a
    # re-emit, with no change to any workflow file.
    #
    # `needs: gate` is what makes the expression readable at all -- without it
    # needs.gate.outputs.authority is the empty string, the condition is false
    # forever, and this job silently never runs again.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'forgejo' }}
    needs: [gate, build-linux-x86_64, docs]
    runs-on: ubuntu-latest
    container:
      image: dvkit/pssparser-ci:manylinux_2_28-x86_64

    steps:
    - uses: actions/checkout@v4

    - name: Download wheels
      uses: forgejo/download-artifact@v4
      with:
        name: wheels-linux-x86_64
        path: dist

    - name: Check the tag matches the package version
      # Guards against tagging v3.0.1 while __version__.py still says 3.0.0 --
      # which would publish a release under the wrong number, unfixably.
      run: |
        tag="${GITHUB_REF#refs/tags/v}"
        base=$(grep '^BASE = ' python/pssparser/__version__.py | sed 's/.*"\(.*\)".*/\1/')
        echo "tag=$tag  BASE=$base"
        if [ "$tag" != "$base" ]; then
          echo "::error::tag v$tag does not match BASE $base in python/pssparser/__version__.py"
          exit 1
        fi
        for w in dist/*.whl; do
          case "$(basename "$w")" in
            pssparser-${base}-*) ;;
            *) echo "::error::wheel $(basename "$w") is not version ${base}"; exit 1 ;;
          esac
        done
        echo "OK: tag, source version and all wheels agree on ${base}"

    - name: Publish to PyPI
      # Plain twine rather than a third-party action: this is the release path,
      # and it should not depend on GitHub being reachable.
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "::error::PYPI_API_TOKEN is not set for this repository"
          exit 1
        fi
        P=/opt/python/cp312-cp312/bin/python
        $P -m twine check dist/*.whl
        $P -m twine upload --non-interactive --skip-existing dist/*.whl
        echo "published $(ls dist/*.whl | wc -l) wheels"
