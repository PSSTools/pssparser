        #     tag" step below exists to stop pssparser shipping.)
        #   * cp314 Windows -- wheels exist, but the line stops at
        #     0.0.2.27891512881 while the project is on ...33288736809.
        #   * cp39 -- ivpm/ivpm-build themselves need >= 3.10: the build dies
        #     in `glob(root_dir=)` and `entry_points(group=)`, both 3.10 APIs.
        #
        # THE LINUX JOBS BUILD cp39..cp314 ANYWAY, and the difference is
        # structural rather than lucky. There, cmake runs ONCE under cp312 and
        # only the extension is compiled per interpreter, so debug-mgr and
        # ivpm are needed for one modern Python. These jobs run the whole
        # toolchain under the matrix Python, so every one of its constraints
        # applies to every entry. Routing these through a fixed driver Python
        # would recover cp39; cp314 stays blocked upstream either way.
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: macos-latest
    env:
      # THE THREE VARIABLES BELOW ARE WHAT MAKE THE WHEEL TAG TRUE, and the
      # 3.13 wheel already on PyPI is the evidence for why they are needed:
      # it is tagged `macosx_26_0_universal2` and is neither of those things.
      #
      #   universal2 -- because setup-python's CPython is a universal2 build,
      #   so setuptools tags by the INTERPRETER's architectures rather than
      #   the extension's. The extension is arm64 only. pip on an Intel Mac
      #   believes that tag, installs, and dies at import.
      #
      #   26_0 -- because with no deployment target set, the tag is taken from
      #   the RUNNER's OS version. That number climbs every time GitHub moves
      #   the macos-latest image, and it makes the wheel uninstallable on
      #   every macOS older than whatever the runner happened to be.
      #
      # ARCHFLAGS drives the compiler, CMAKE_OSX_ARCHITECTURES drives the
      # native library build (CMake does not read ARCHFLAGS), and
      # _PYTHON_HOST_PLATFORM overrides the tag setuptools would otherwise
      # derive from the interpreter. All three, or the tag and the binary
      # disagree again in one direction or another.
      #
      # 13.0 is a floor, not a description of the runner: arm64 Macs run
      # macOS 11 and up, and CMake takes CMAKE_OSX_DEPLOYMENT_TARGET from
      # MACOSX_DEPLOYMENT_TARGET so the native libraries get the same floor as
      # the extensions.
      MACOSX_DEPLOYMENT_TARGET: '13.0'
