# CI for psstools/pssparser on GitHub Actions.
#
# THIS WORKFLOW IS THE RELEASE PATH, as of 2026-09-01. It publishes to PyPI on
# a `v*` tag, and only when the release-authority switch names this forge --
# sync-policy.toml pins release_authority = "github" for this repository, which
# is the one place both forges read.
#
# WHY IT MOVED BACK, having been on Forgejo since 2026-08-31: WHEELS. This
# package ships a compiled Cython extension, so a release is not one artifact
# but a matrix of them, and .forgejo/workflows/ci.yml builds exactly one --
# linux x86_64, by a scope decision recorded in its own header. Everything
# else this project supports is built HERE: linux aarch64, Windows and macOS.
# Under Forgejo authority a tagged release could only ever carry a quarter of
# its platforms, and `pip install pssparser` on a Mac or on Windows would fall
# back to a source build that cannot succeed without ANTLR and a C++ toolchain.
# The v3.0.7 cycle is the concrete case: the win32 support that made a Windows
# wheel possible was developed and merged here, on the forge that could not
# release it.
#
# HAVING ALL FOUR PLATFORMS IS NOT THE SAME AS SERVING THEM, which v3.1.0 --
# the first release under this authority -- demonstrated: the manylinux jobs
# build cp39..cp314 from the interpreters in the manylinux image, but the
# Windows and macOS jobs each pinned one setup-python version, so that release
# published six wheels per linux architecture against one Windows wheel
# (cp311) and one macOS wheel (cp313). Every other Windows and macOS Python
# still fell back to the source build that cannot succeed -- the same failure
# the authority moved here to prevent, narrowed from a platform to a version.
# Both jobs are matrices as of 2026-09-02, and `publish-pypi` now checks the
# platform coverage of what it is about to upload.
#
# THEY ARE FOUR-WAY, NOT SIX. cp39 and cp314 were tried on both and neither
# can build today -- ivpm needs >= 3.10, and `debug-mgr` (a build-time C++
# dependency with no sdist) has no usable cp314 wheel for either platform.
# Both bounds are upstream and are documented where they bite, on the
# `python:` matrix in ci-win32. So a release is 6+6+4+4 = 20 wheels, against
# v3.1.0's 6+6+1+1 = 14.
#
# ALL FOUR ARE MATRICES AS OF 2026-09-13. The manylinux jobs kept building
# their six wheels in a serial loop inside one job long after Windows and macOS
# were split, and that loop was the entire critical path: 33m and 30m against
# 5-13m everywhere else, ~70-86% of it in the loop. The wheel count is
# unchanged at 20 -- this is the same work, run per-ABI instead of end to end.
# See the note on ci-linux for why duplicating the native build is the cheaper
# side of the trade, and for the -DCMAKE_BUILD_TYPE=Release fix that came with
# it.
#
# The Forgejo publish job is NOT deleted in exchange. It reads the same switch,
# so it disarms itself the moment the switch says "github", and re-arms if the
# switch is ever moved back. Deleting it would make the move one-way for no
# gain; the switch exists precisely so that exactly one of the two can fire.
# What is deliberately NOT restored is the old per-push dev-wheel stream -- see
# the note above `publish-pypi`.

name: CI
on:
  - push
  - pull_request
  - workflow_dispatch
jobs:
  # ---------------------------------------------------------------------- #
  # The release-authority master switch. Resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job, so the value has
  # to arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error -- the publish condition is then
  # false forever, nothing publishes, and nothing goes red. That is the
  # quietest failure available here, so the shadow check in
  # .forgejo/workflows/conformance.yml asserts the wiring explicitly, across
  # BOTH workflow directories.
  #
  # Deliberately a copy of the Forgejo workflow's `gate` rather than a shared
  # action: this job's entire job is to be the thing that does not depend on
  # the other forge.
  # ---------------------------------------------------------------------- #
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # FAIL CLOSED WHEN A RELEASE COULD ACTUALLY HAPPEN, and quietly
            # otherwise. In this org a release is a `v*` TAG, so that -- not
            # the event name -- is the test. Keying on the event name would be
            # wrong in both directions: a tag push IS a push, so it would let a
            # release through unresolved, and every ordinary push would then
            # also be treated as release-critical and fail the build.
            #
            # A release blocked by a dvkit.org outage is recoverable in ten
            # minutes. A version published twice from two forges is not: PyPI
            # lets a version be yanked, never reused.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable, and this ref cannot release; continuing"
                exit 0 ;;
            esac
          fi
          # CASE-FOLDED, and on this forge that is load-bearing rather than
          # defensive. The repository is named `PSSTools/pssparser` on GitHub
          # and `psstools/pssparser` on Forgejo, and $GITHUB_REPOSITORY carries
          # whichever the host thinks it is. sync-policy.toml emits lowercase
          # keys, so an exact-match lookup here MISSES and silently falls
          # through to d["default"] -- returning an authority this repository
          # never pinned, with no error and no clue in the log. Today the
          # default happens to be "github" and the wrong answer coincides with
          # the right one, which is exactly the condition under which this
          # would go unnoticed until the day the default moves.
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"].lower(); print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  ci-linux:
    # ONE JOB PER ABI, as of 2026-09-13. This was a serial
    # `for py in cp39 ... cp314` loop inside a single job, and that loop was
    # the whole critical path: 1381s of the job's 1980s, against 5-6 minute
    # Windows and macOS jobs that have been matrices since 2026-09-02.
    #
    # The usual argument against splitting is that the matrix duplicates the
    # shared native build. Measured, that argument does not hold here: the
    # cmake/ninja build of the C++ core is ~170s against ~230s PER WHEEL, and
    # the per-wheel cost is almost entirely one translation unit -- the
    # Cythonized python/ast.cpp, 556k lines, ~3 minutes of g++ on its own.
    # That cost is per-ABI and irreducible; it is also perfectly parallel.
    # Duplicating ~17 CPU-minutes of native build to remove ~23 wall-clock
    # minutes is the trade, and on a public repo the runners are free.
    #
    # The matrix is SIX wide, not four: linux ships cp39-cp314 where Windows
    # and macOS ship 3.10-3.13. The publish job's per-platform wheel-count
    # floor (>= 6 here) is what pins that.
    strategy:
      # OFF so that one broken ABI reports as one broken ABI. With it on the
      # first failure cancels its siblings, and the log then cannot answer
      # "was this cp314 only, or everything?" -- same reasoning as ci-win32.
      fail-fast: false
      matrix:
        py: ['cp39-cp39', 'cp310-cp310', 'cp311-cp311', 'cp312-cp312', 'cp313-cp313', 'cp314-cp314']
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
    - uses: actions/checkout@v4
    - name: Stamp version
      # THE TAG IS THE VERSION (2026-09-13). On a `v*` build this substitutes
      # the tag into BASE; everything else gets a .<run-id> dev suffix on the
      # 0.0.0 placeholder that is committed. There is no version to bump
      # before tagging, and nothing in the tree to keep in step with the tag.
      #
      # This step used to do the opposite -- leave the committed BASE alone on
      # a tag and let the publish job REFUSE the release if the two disagreed.
      # That check was correct and caught nothing useful: the failure it
      # guarded against was forgetting to hand-edit a file, which is a step
      # that should not exist. Substituting removes the step and the check
      # together.
      #
      # IDENTICAL ON ALL FOUR PLATFORMS, which the previous form was not: it
      # used `sed -i`, whose argument handling differs between GNU and BSD, so
      # macOS carried its own copy with `sed -i ''`. Writing through a temp
      # file needs no -i and so needs no per-platform variant.
      run: |
        set -eu
        case "$GITHUB_REF" in
          refs/tags/v*)
            v="${GITHUB_REF#refs/tags/v}"
            # THE TAG IS SPELLED THE PEP 440 WAY -- v3.2.0, v3.2.0rc1 -- and
            # goes into this file VERBATIM. Git tag, PyPI version and wheel
            # filename are then one identical string with no transformation
            # anywhere between them.
            #
            # The two ecosystems do spell a pre-release differently: semver
            # requires the hyphen, so npm wants `3.2.0-rc1` where Python wants
            # `3.2.0rc1`. Tagging the PEP 440 way puts that conversion where
            # it costs nothing, because NPM DOES IT ITSELF -- `npm version
            # 3.2.0rc1` writes "3.2.0-rc1". setuptools does not reciprocate:
            # given `3.2.0-rc1` it still names the wheel pssparser-3.2.0rc1-*
            # while setup.py reports the hyphenated form, so a semver-spelled
            # tag would leave this workflow hand-converting a version string
            # and comparing the wrong spelling against wheel filenames.
            #
            # So nothing here reformats a version. Each ecosystem normalises
            # what it is handed, and the publish job cross-checks that the two
            # spellings denote the same release.
            #
            # `rc` only; alpha and beta are not accepted because nothing has
            # asked for them.
            bad=0
            case "$v" in
              *rc*)
                core="${v%rc*}"
                rcnum="${v##*rc}"
                case "$core"  in ''|*[!0-9.]*) bad=1 ;; esac
                case "$rcnum" in ''|*[!0-9]*)  bad=1 ;; esac
                ;;
              *)
                case "$v" in ''|*[!0-9.]*) bad=1 ;; esac
                ;;
            esac
            if [ "$bad" -ne 0 ]; then
              echo "::error::tag v$v is not <major>.<minor>.<patch> or <major>.<minor>.<patch>rc<N> (PEP 440 spelling: v3.2.0rc1, not v3.2.0-rc1)"
              exit 1
            fi
            sed 's/^BASE = .*$/BASE = "'"$v"'"/' python/pssparser/__version__.py > __version__.stamped
            mv __version__.stamped python/pssparser/__version__.py
            # ANTI-VACUITY. A sed whose pattern matches nothing exits 0 and
            # leaves the file untouched, so a rename or reformat of
            # __version__.py would turn this step into a silent no-op and
            # ship the 0.0.0 placeholder as a release.
            grep -q "^BASE = \"$v\"$" python/pssparser/__version__.py || {
              echo "::error::failed to stamp version $v into python/pssparser/__version__.py"
              exit 1
            }
            ;;
          *)
            sed 's/^SUFFIX = ""$/SUFFIX = ".'"$GITHUB_RUN_ID"'"/' python/pssparser/__version__.py > __version__.stamped
            mv __version__.stamped python/pssparser/__version__.py
            ;;
        esac
        grep -E '^(BASE|SUFFIX) = ' python/pssparser/__version__.py
    - name: Install additional build dependencies
      # This job's ABI only. The loop that stood here installed into all six
      # interpreters because one job built all six wheels.
      run: |
        yum install -y libuuid-devel
        yum install -y java-11-openjdk-devel
        /opt/python/${{ matrix.py }}/bin/python -m pip install ninja wheel cython setuptools ivpm ivpm-build build
    - name: Fetch source dependencies
      # cp312 is the TOOLING interpreter -- ivpm here, auditwheel below -- and
      # stays cp312 on every matrix entry. It is deliberately not
      # ${{ matrix.py }}: ivpm and auditwheel are build tools, unrelated to the
      # ABI being built, so pinning them means the cp39 and cp314 entries run
      # the same tooling as everything else rather than whatever pip can
      # resolve for the oldest and newest interpreters.
      run: |
        export IVPM_PYTHON=/opt/python/cp312-cp312/bin/python
        ${IVPM_PYTHON} -m pip install twine auditwheel build
        ${IVPM_PYTHON} -m ivpm update -j 1 -a
    - name: Build packages
      # -DCMAKE_BUILD_TYPE=Release IS LOAD-BEARING, and its absence was a
      # silent doubling of the native build (fixed 2026-09-13).
      #
      # This step does not stand alone: ivpm_build's BuildExt.build_extensions
      # runs CmakeBuilder on every `python -m build` whenever CMakeLists.txt
      # exists, and CmakeBuilder configures THIS SAME build/ directory with
      # `-DCMAKE_BUILD_TYPE=Release -DPACKAGES_DIR=<proj>/packages
      # -DCMAKE_INSTALL_PREFIX=<proj>/build`. The latter two match what
      # CMakeLists.txt already defaults to, so the build type was the only
      # real difference -- and changing it on an existing cache changes every
      # compile flag, so the first wheel build rebuilt all 228 objects this
      # step had just built unoptimised. The logs show the 228-target build
      # running exactly twice, for exactly that reason.
      #
      # So why keep the step at all, rather than let CmakeBuilder do the one
      # build it was always going to do? Because setup.py computes
      # `antlr4_rt_lib` by globbing build/lib*/libantlr4-runtime.so* at MODULE
      # level -- before setup() runs, so before build_ext, so before cmake. On
      # a fresh runner with no build/ the glob finds nothing, antlr4_rt_lib is
      # None, and the ANTLR runtime is quietly left out of ivpm_extra_data.
      # That ordering is a setup.py problem; priming build/ here is what keeps
      # it from becoming this workflow's problem. Deleting this step needs
      # that fixed first.
      run: |
        export PATH=/opt/python/cp312-cp312/bin:$PATH
        mkdir build
        cd build
        cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release
        ninja
    - name: Build Python wheel
      run: |
        /opt/python/${{ matrix.py }}/bin/python -m build --wheel --no-isolation
    - name: Audit Wheels
      run: |
        for whl in dist/*.whl; do
          [ -f "$whl" ] || continue
          /opt/python/cp312-cp312/bin/auditwheel repair $whl
          rm $whl
        done
        if ls wheelhouse/*.whl 2>/dev/null | grep -q .; then
          cp wheelhouse/*.whl dist
        fi
    - name: Upload wheels
      # PER-ABI ARTIFACT NAME, for the reason spelled out on the ci-win32
      # upload: upload-artifact@v4 rejects a second upload under an existing
      # name, so a shared `wheels-linux-x86_64` would fail five of the six
      # entries outright. The publish job collects on `wheels-*` with
      # merge-multiple, so the split names land back in one dist/.
      uses: actions/upload-artifact@v4
      with:
        name: wheels-linux-x86_64-${{ matrix.py }}
        path: dist/*.whl
        if-no-files-found: error
    - name: Check the PSS corpus
      # VERIFIES the corpus; it does not fetch it. ivpm.yaml declares
      # pss-corpus in `default-dev`, and "Fetch source dependencies" runs
      # `ivpm update -a`, which resolves the dev set -- so the corpus arrives
      # the same way every other dependency does.
      #
      # A hand-written `git clone https://git.dvkit.org/...` stood here. It
      # dated from before C-2a landed, when the psstools/pss-corpus mirror
      # ivpm.yaml names did not resolve. Now that it does, ivpm clones the
      # corpus first and the clone died on "destination path already exists".
      # Deleted rather than made conditional: ivpm.yaml is where this
      # repository says what it depends on and where it comes from, and a
      # second fetch path in CI is a place for the two to disagree. It also
      # took this workflow off git.dvkit.org, which was the one point where it
      # reached outside GitHub.
      #
      # The check itself stays. tests/python/corpus/test_pss_corpus.py fails
      # rather than skips on an absent corpus (pss-corpus PLAN.md C-8), but it
      # runs two steps and several minutes later; failing here says "the
      # dependency did not arrive" instead of "a sweep found nothing".
      run: |
        set -eu
        n=$(find packages/pss-corpus/curated -name '*.pss' | wc -l)
        echo "corpus: $n .pss files"
        if [ "$n" -lt 50 ]; then
          echo "::error::corpus resolved but looks wrong ($n files, expected 50+)"
          exit 1
        fi

    - name: Run Python tests
      # PYTHONPATH points at the ivpm checkout of pyastbuilder because
      # tests/python/test_astbuilder_codegen.py imports `astbuilder`, the AST
      # code generator, which is a BUILD-time tool and so is deliberately not
      # in the wheel. Without it the module fails at import and pytest exits 2
      # on a collection error -- taking all 3276 tests with it, not just this
      # one.
      #
      # The ivpm checkout rather than `pip install pyastbuilder`, even though
      # PyPI has one. That test asserts on generated source in order to pin
      # defects in the generator, so it is only meaningful against the same
      # generator that produced this build's AST -- which is the checkout that
      # scripts/gen_ast.py ran from. Installing a release would let the tool
      # under test and the tool that built the artifact drift apart silently.
      #
      # This does not weaken testing against the installed wheel: that
      # directory contains `astbuilder` and nothing else, so `pssparser` still
      # resolves from the wheel installed below.
      #
      # pyyaml and toposort are astbuilder's own imports (parser.py, linker.py).
      #
      # STILL cp312 AND cp313 ONLY, now expressed as a matrix condition rather
      # than a loop. Widening to all six ABIs is nearly free here -- the
      # entries run in parallel -- but it is a coverage change, not a
      # parallelism change, and it does not belong in the same commit as the
      # split: cp39 and cp314 have never run this suite, so any failure they
      # turn up would arrive looking like a regression from the matrix.
      if: matrix.py == 'cp312-cp312' || matrix.py == 'cp313-cp313'
      run: |
        /opt/python/${{ matrix.py }}/bin/python -m pip install pytest pyyaml toposort dist/*.whl
        PYTHONPATH="$PWD/packages/pyastbuilder/src" \
          /opt/python/${{ matrix.py }}/bin/python -m pytest tests/python -v --tb=short
    - name: System test
      # Every entry, where this used to be cp313 only: it is four seconds, it
      # needs no condition, and "the wheel this job just built imports and
      # parses" is worth asserting per ABI rather than for one of six.
      run: |
        /opt/python/${{ matrix.py }}/bin/python -m venv /tmp/test-venv
        source /tmp/test-venv/bin/activate
        pip install dist/*.whl
        python -c "from pssparser import Parser; p = Parser(); assert p.parses([('test.pss', 'component pss_top {}')]); print('System test PASSED')"

