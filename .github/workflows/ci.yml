  ci-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Stamp build version
      run: |
        sed -i '' 's/^SUFFIX = ""$/SUFFIX = ".'"$GITHUB_RUN_ID"'"/' python/pssparser/__version__.py
        grep '^SUFFIX = ' python/pssparser/__version__.py
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    - name: Install Packages
      run: |
        python -m pip install ivpm ivpm-build twine cython ninja wheel cmake build
        python -m ivpm update -j 1 -a
    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -GNinja
        ninja
    - name: Build Python wheel
      run: |
        python -m build --wheel --no-isolation
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-macos
        path: dist/*.whl
        if-no-files-found: error
    - name: System test
      run: |
        python -m venv /tmp/test-venv
        source /tmp/test-venv/bin/activate
        pip install dist/*.whl
        python -c "from pssparser import Parser; p = Parser(); assert p.parses([('test.pss', 'component pss_top {}')]); print('System test PASSED')"

  # A `publish` job stood here. It uploaded every master push to PyPI as
  # <base>.<github-run-id>, and it is DELETED rather than tag-gated.
  #
  # Deleted, because tag-gating it would have created a SECOND path to the
  # same PyPI project, on a different forge, keyed on the same tag. The
  # release-authority switch exists precisely so that only one of the two can
  # fire -- but the cheaper and more legible arrangement, where a repository
  # has an unambiguous release path at all, is one publisher. This repository
  # has one, and it is .forgejo/workflows/ci.yml.
  #
  # The per-push dev-wheel stream goes with it. That was decided estate-wide
  # on 2026-08-27: a release is an explicitly tagged version, and run-id
  # -qualified releases are not something this project does. PyPI still holds
  # the ones already published (3.0.0.27726656373 and friends); nothing new
  # joins them. If a prerelease channel is wanted, it needs designing -- it is
  # explicitly out of scope for this plan, not forgotten.
  #
  # Everything that made the removed job trustworthy already exists on the
  # Forgejo side and is stricter: it checks the tag against BASE in
  # python/pssparser/__version__.py AND against every wheel filename, and it
  # consults the release-authority switch. The wheels this workflow builds are
  # still uploaded as ARTIFACTS above, which is what makes them reviewable
  # without being publishable.

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Sphinx dependencies
      run: |
        python -m pip install sphinx sphinx-rtd-theme
    - name: Build Sphinx docs
      run: |
        sphinx-build -b html docs docs/_build/html
    # A gh-pages deploy stood here, unconditional except for the branch,
    # publishing https://psstools.github.io/pssparser/ on every master push.
    # Deleted: dvkit.org owns documentation for this estate, and the docs job
    # in .forgejo/workflows/ci.yml already uploads the real doc set as the
    # `docs-psstools-pssparser` artifact for the host-side deploy to collect.
    #
    # That one is also the better doc set, and not by a little. It installs
    # the built wheel first, because docs/conf.py uses autodoc to import
    # pssparser.ast and pssparser.core -- compiled Cython extensions that do
    # not exist in a source checkout. The build below is a bare `sphinx-build`
    # over the source tree, so its API reference is empty, and Sphinx exits 0
    # while producing it. Keeping it as a CI check is fine. Publishing it
    # would have been publishing the emptier of the two.
    - name: Sanity-check the docs build
      run: |
        test -s docs/_build/html/index.html \
          || { echo "::error::no index.html in the docs build output"; exit 1; }
        echo "generated pages: $(find docs/_build/html -name '*.html' | wc -l)"
