    # ARM64 ONLY, DELIBERATELY. GitHub's Intel macOS runner is gone, so an
    # x86_64 wheel could only be cross-compiled here and never executed --
    # including by the system test below, which is the step that has actually
    # been catching packaging faults. A missing wheel makes `pip install`
