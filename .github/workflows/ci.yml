    # install and then fail at import, which is strictly worse. If Intel
    # coverage is wanted it needs a real x86_64 executor, not a flag here.
    strategy:
      fail-fast: false
      matrix:
        # 3.10..3.13, NOT cp39..cp314 -- and the bound is `debug-mgr`'s
        # release matrix, not this project's. It is a build-time C++
        # dependency resolved from PyPI, it publishes NO SDIST, so a Python
        # with no compatible wheel has no fallback: ivpm resolves it, nothing
