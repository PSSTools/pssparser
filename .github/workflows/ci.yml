      # it from becoming this workflow's problem. Deleting this step needs
      # that fixed first.
      run: |
        export PATH=/opt/python/cp312-cp312/bin:$PATH
        mkdir build
        cd build
        cmake .. -GNinja -DCMAKE_BUILD_TYPE=Release
        ninja
    - name: Build Python wheel
      run: |
        /opt/python/${{ matrix.py }}/bin/python -m build --wheel --no-isolation
    - name: Audit Wheels
      run: |
        for whl in dist/*.whl; do
          [ -f "$whl" ] || continue
          /opt/python/cp312-cp312/bin/auditwheel repair $whl
          rm $whl
        done
        if ls wheelhouse/*.whl 2>/dev/null | grep -q .; then
          cp wheelhouse/*.whl dist
        fi
    - name: Upload wheels
      # PER-ABI ARTIFACT NAME -- see the note on the ci-linux upload.
      uses: actions/upload-artifact@v4
      with:
        name: wheels-linux-aarch64-${{ matrix.py }}
        path: dist/*.whl
        if-no-files-found: error

    # ---- Tests, which this job did not have before 2026-09-13 ------------ #
    #
    # aarch64 shipped on a smoke test alone: it built six wheels, uploaded
    # them, imported one, and parsed one component. The full suite and the
    # corpus sweep ran on x86_64 only, so an arch-dependent defect -- an
    # alignment or endianness assumption in the C++ core, a size_t/int narrowing
    # that only bites on a different ABI -- had no way to show up before a user
    # hit it. The job names imply symmetry with ci-linux that was not there.
    #
    # Adding it was cheap only once this job became a matrix: appended to the
    # old serial job these steps would have extended an already 30-minute
    # critical path. In parallel they land inside an entry that is doing
    # nothing else.
    - name: Check the PSS corpus
      # See the ci-linux copy for why this verifies rather than fetches, and
      # why a missing corpus should fail here rather than in the sweep.
      run: |
        set -eu
        n=$(find packages/pss-corpus/curated -name '*.pss' | wc -l)
        echo "corpus: $n .pss files"
        if [ "$n" -lt 50 ]; then
          echo "::error::corpus resolved but looks wrong ($n files, expected 50+)"
          exit 1
        fi
    - name: Run Python tests
      # cp312/cp313 to match ci-linux exactly. Same PYTHONPATH reasoning as
      # there: astbuilder is a build-time tool, absent from the wheel, and
      # without it test_astbuilder_codegen.py fails at import and takes the
      # whole collection with it.
      if: matrix.py == 'cp312-cp312' || matrix.py == 'cp313-cp313'
      run: |
        /opt/python/${{ matrix.py }}/bin/python -m pip install pytest pyyaml toposort dist/*.whl
        PYTHONPATH="$PWD/packages/pyastbuilder/src" \
          /opt/python/${{ matrix.py }}/bin/python -m pytest tests/python -v --tb=short
    - name: System test
      run: |
        /opt/python/${{ matrix.py }}/bin/python -m venv /tmp/test-venv
        source /tmp/test-venv/bin/activate
        pip install dist/*.whl
        python -c "from pssparser import Parser; p = Parser(); assert p.parses([('test.pss', 'component pss_top {}')]); print('System test PASSED')"

  ci-win32:
    # ONE MATRIX ENTRY PER PYTHON, matching the cp39..cp314 loop the manylinux
    # jobs run. This job used to build a single 3.11 wheel, which is why
    # v3.1.0 shipped exactly one Windows artifact -- pssparser-3.1.0-cp311-
    # cp311-win_amd64.whl -- and every other Windows Python fell through to a
    # source build that cannot succeed without ANTLR and MSVC.
    #
    # A MATRIX rather than a for-loop inside one job, unlike the manylinux
    # jobs: those get every interpreter for free from the manylinux image, so
    # looping costs one container. Here each version has to be installed by
    # actions/setup-python, and a loop would mean repeatedly swapping the
    # active interpreter under a single cmake/build_ext configuration whose
    # build/ directory is keyed to whichever Python configured it first.
    #
    # fail-fast IS OFF so that one broken version reports as one broken
    # version. With it on, the first failure cancels the siblings and the log
    # cannot distinguish "3.14 is broken" from "3.14 is broken and so are the
    # four that never ran".
    strategy:
      fail-fast: false
      matrix:
        # 3.10..3.13, NOT cp39..cp314 -- and the bound is `debug-mgr`'s
        # release matrix, not this project's. It is a build-time C++
        # dependency resolved from PyPI, it publishes NO SDIST, so a Python
        # with no compatible wheel has no fallback: ivpm resolves it, nothing
        # installs, and the failure surfaces later as a cmake error about a
        # missing include directory. Measured against PyPI on 2026-09-02:
        #
        #   * cp314 macOS -- every recent wheel is tagged `macosx_26_0`, which
        #     pip rejects here because this job pins a 13.0 deployment target.
        #     The newest usable-at-a-lower-floor one is `macosx_15_0`, still
        #     above 13.0. (That mistag is the same defect the "Check the wheel
        #     tag" step below exists to stop pssparser shipping.)
        #   * cp314 Windows -- wheels exist, but the line stops at
        #     0.0.2.27891512881 while the project is on ...33288736809.
        #   * cp39 -- ivpm/ivpm-build themselves need >= 3.10: the build dies
        #     in `glob(root_dir=)` and `entry_points(group=)`, both 3.10 APIs.
        #
        # THE LINUX JOBS BUILD cp39..cp314 ANYWAY, and the difference is
        # structural rather than lucky. There, cmake runs ONCE under cp312 and
        # only the extension is compiled per interpreter, so debug-mgr and
        # ivpm are needed for one modern Python. These jobs run the whole
        # toolchain under the matrix Python, so every one of its constraints
        # applies to every entry. Routing these through a fixed driver Python
        # would recover cp39; cp314 stays blocked upstream either way.
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    # find_package(ANTLR) shells out to the antlr jar to detect its version,
    # and the grammars are code-generated with it during the build.
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    - name: Stamp version
      # THE TAG IS THE VERSION (2026-09-13). On a `v*` build this substitutes
      # the tag into BASE; everything else gets a .<run-id> dev suffix on the
      # 0.0.0 placeholder that is committed. There is no version to bump
      # before tagging, and nothing in the tree to keep in step with the tag.
      #
      # This step used to do the opposite -- leave the committed BASE alone on
      # a tag and let the publish job REFUSE the release if the two disagreed.
      # That check was correct and caught nothing useful: the failure it
      # guarded against was forgetting to hand-edit a file, which is a step
      # that should not exist. Substituting removes the step and the check
      # together.
      #
      # IDENTICAL ON ALL FOUR PLATFORMS, which the previous form was not: it
      # used `sed -i`, whose argument handling differs between GNU and BSD, so
      # macOS carried its own copy with `sed -i ''`. Writing through a temp
      # file needs no -i and so needs no per-platform variant.
      run: |
        set -eu
        case "$GITHUB_REF" in
          refs/tags/v*)
            v="${GITHUB_REF#refs/tags/v}"
            # THE TAG IS SPELLED THE PEP 440 WAY -- v3.2.0, v3.2.0rc1 -- and
            # goes into this file VERBATIM. Git tag, PyPI version and wheel
            # filename are then one identical string with no transformation
            # anywhere between them.
            #
            # The two ecosystems do spell a pre-release differently: semver
            # requires the hyphen, so npm wants `3.2.0-rc1` where Python wants
            # `3.2.0rc1`. Tagging the PEP 440 way puts that conversion where
            # it costs nothing, because NPM DOES IT ITSELF -- `npm version
            # 3.2.0rc1` writes "3.2.0-rc1". setuptools does not reciprocate:
            # given `3.2.0-rc1` it still names the wheel pssparser-3.2.0rc1-*
            # while setup.py reports the hyphenated form, so a semver-spelled
            # tag would leave this workflow hand-converting a version string
            # and comparing the wrong spelling against wheel filenames.
            #
            # So nothing here reformats a version. Each ecosystem normalises
            # what it is handed, and the publish job cross-checks that the two
            # spellings denote the same release.
            #
            # `rc` only; alpha and beta are not accepted because nothing has
            # asked for them.
            bad=0
            case "$v" in
              *rc*)
                core="${v%rc*}"
                rcnum="${v##*rc}"
                case "$core"  in ''|*[!0-9.]*) bad=1 ;; esac
                case "$rcnum" in ''|*[!0-9]*)  bad=1 ;; esac
                ;;
              *)
                case "$v" in ''|*[!0-9.]*) bad=1 ;; esac
                ;;
            esac
            if [ "$bad" -ne 0 ]; then
              echo "::error::tag v$v is not <major>.<minor>.<patch> or <major>.<minor>.<patch>rc<N> (PEP 440 spelling: v3.2.0rc1, not v3.2.0-rc1)"
              exit 1
            fi
            sed 's/^BASE = .*$/BASE = "'"$v"'"/' python/pssparser/__version__.py > __version__.stamped
            mv __version__.stamped python/pssparser/__version__.py
            # ANTI-VACUITY. A sed whose pattern matches nothing exits 0 and
            # leaves the file untouched, so a rename or reformat of
            # __version__.py would turn this step into a silent no-op and
            # ship the 0.0.0 placeholder as a release.
            grep -q "^BASE = \"$v\"$" python/pssparser/__version__.py || {
              echo "::error::failed to stamp version $v into python/pssparser/__version__.py"
              exit 1
            }
            ;;
          *)
            sed 's/^SUFFIX = ""$/SUFFIX = ".'"$GITHUB_RUN_ID"'"/' python/pssparser/__version__.py > __version__.stamped
            mv __version__.stamped python/pssparser/__version__.py
            ;;
        esac
        grep -E '^(BASE|SUFFIX) = ' python/pssparser/__version__.py
    - name: Install Packages
      run: |
        python -m pip install ivpm ivpm-build cython ninja cmake wheel setuptools build
        python -m ivpm update -j 1 -a
    # No separate cmake step: build_ext drives its own cmake configure/build/
    # install of the native libraries (Release, prefix=build/) before compiling
    # the extensions.  Running cmake by hand first would only configure the
    # same build dir with different arguments and force a full rebuild.
    - name: Build Python wheel
      run: |
        python -m build --wheel --no-isolation
    - name: Upload wheels
      # PER-VERSION ARTIFACT NAME. upload-artifact@v4 rejects a second upload
      # under a name that already exists, so a shared `wheels-windows` would
      # make five of the six matrix entries fail outright. The publish job
      # collects on the `wheels-*` pattern with merge-multiple, so the split
      # names land back in one dist/ regardless.
      uses: actions/upload-artifact@v4
      with:
        name: wheels-windows-py${{ matrix.python }}
        path: dist/*.whl
        if-no-files-found: error
    - name: System test
      run: |
        python -m venv /c/test-venv
        /c/test-venv/Scripts/pip install dist/*.whl
        /c/test-venv/Scripts/python -c "from pssparser import Parser; p = Parser(); assert p.parses([('test.pss', 'component pss_top {}')]); print('System test PASSED')"

