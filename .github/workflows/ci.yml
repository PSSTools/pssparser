# CI for psstools/pssparser on GitHub Actions.
#
# CI ONLY. THIS WORKFLOW DOES NOT PUBLISH ANYTHING, and that is deliberate
# rather than incidental -- see the block where the publish job used to be.
# The release path for this package is .forgejo/workflows/ci.yml, and
# sync-policy.toml pins release_authority = "forgejo" for this repository to
# say so in the one place both forges read.

name: CI
on:
  - push
  - pull_request
  - workflow_dispatch
jobs:
  ci-linux:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
    - uses: actions/checkout@v4
    - name: Stamp build version
      run: |
        sed -i 's/^SUFFIX = ""$/SUFFIX = ".'"$GITHUB_RUN_ID"'"/' python/pssparser/__version__.py
        grep '^SUFFIX = ' python/pssparser/__version__.py
    - name: Install additional build dependencies
      run: |
        yum install -y libuuid-devel
        yum install -y java-11-openjdk-devel
        for py in cp39-cp39 cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
          /opt/python/${py}/bin/python -m pip install ninja wheel cython setuptools ivpm ivpm-build
        done
    - name: Fetch source dependencies
      run: |
        export IVPM_PYTHON=/opt/python/cp312-cp312/bin/python
        ${IVPM_PYTHON} -m pip install twine auditwheel build
        ${IVPM_PYTHON} -m ivpm update -j 1 -a
    - name: Build packages
      run: |
        export PATH=/opt/python/cp312-cp312/bin:$PATH
        mkdir build
        cd build
        cmake .. -GNinja
        ninja
    - name: Build Python wheels
      run: |
        for py in cp39-cp39 cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
          /opt/python/${py}/bin/python -m pip install build
          /opt/python/${py}/bin/python -m build --wheel --no-isolation
        done
    - name: Audit Wheels
      run: |
        for whl in dist/*.whl; do
          [ -f "$whl" ] || continue
          /opt/python/cp312-cp312/bin/auditwheel repair $whl
          rm $whl
        done
        if ls wheelhouse/*.whl 2>/dev/null | grep -q .; then
          cp wheelhouse/*.whl dist
        fi
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-linux-x86_64
        path: dist/*.whl
        if-no-files-found: error
    - name: Check the PSS corpus
      # VERIFIES the corpus; it does not fetch it. ivpm.yaml declares
      # pss-corpus in `default-dev`, and "Fetch source dependencies" runs
      # `ivpm update -a`, which resolves the dev set -- so the corpus arrives
      # the same way every other dependency does.
      #
      # A hand-written `git clone https://git.dvkit.org/...` stood here. It
      # dated from before C-2a landed, when the psstools/pss-corpus mirror
      # ivpm.yaml names did not resolve. Now that it does, ivpm clones the
      # corpus first and the clone died on "destination path already exists".
      # Deleted rather than made conditional: ivpm.yaml is where this
      # repository says what it depends on and where it comes from, and a
      # second fetch path in CI is a place for the two to disagree. It also
      # took this workflow off git.dvkit.org, which was the one point where it
      # reached outside GitHub.
      #
      # The check itself stays. tests/python/corpus/test_pss_corpus.py fails
      # rather than skips on an absent corpus (pss-corpus PLAN.md C-8), but it
      # runs two steps and several minutes later; failing here says "the
      # dependency did not arrive" instead of "a sweep found nothing".
      run: |
        set -eu
        n=$(find packages/pss-corpus/curated -name '*.pss' | wc -l)
        echo "corpus: $n .pss files"
        if [ "$n" -lt 50 ]; then
          echo "::error::corpus resolved but looks wrong ($n files, expected 50+)"
          exit 1
        fi

    - name: Run Python tests
      # PYTHONPATH points at the ivpm checkout of pyastbuilder because
      # tests/python/test_astbuilder_codegen.py imports `astbuilder`, the AST
      # code generator, which is a BUILD-time tool and so is deliberately not
      # in the wheel. Without it the module fails at import and pytest exits 2
      # on a collection error -- taking all 3276 tests with it, not just this
      # one.
      #
      # The ivpm checkout rather than `pip install pyastbuilder`, even though
      # PyPI has one. That test asserts on generated source in order to pin
      # defects in the generator, so it is only meaningful against the same
      # generator that produced this build's AST -- which is the checkout that
      # scripts/gen_ast.py ran from. Installing a release would let the tool
      # under test and the tool that built the artifact drift apart silently.
      #
      # This does not weaken testing against the installed wheel: that
      # directory contains `astbuilder` and nothing else, so `pssparser` still
      # resolves from the wheel installed below.
      #
      # pyyaml and toposort are astbuilder's own imports (parser.py, linker.py).
      run: |
        for py in cp312-cp312 cp313-cp313; do
          /opt/python/${py}/bin/python -m pip install pytest pyyaml toposort dist/*${py%%-*}*.whl
          PYTHONPATH="$PWD/packages/pyastbuilder/src" \
            /opt/python/${py}/bin/python -m pytest tests/python -v --tb=short
        done
    - name: System test
      run: |
        /opt/python/cp313-cp313/bin/python -m venv /tmp/test-venv
        source /tmp/test-venv/bin/activate
        pip install dist/*cp313*.whl
        python -c "from pssparser import Parser; p = Parser(); assert p.parses([('test.pss', 'component pss_top {}')]); print('System test PASSED')"

  ci-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    container: quay.io/pypa/manylinux_2_28_aarch64
    steps:
    - uses: actions/checkout@v4
    - name: Stamp build version
      run: |
        sed -i 's/^SUFFIX = ""$/SUFFIX = ".'"$GITHUB_RUN_ID"'"/' python/pssparser/__version__.py
        grep '^SUFFIX = ' python/pssparser/__version__.py
    - name: Install additional build dependencies
      run: |
        yum install -y libuuid-devel
        yum install -y java-11-openjdk-devel
        for py in cp39-cp39 cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
          /opt/python/${py}/bin/python -m pip install ninja wheel cython setuptools ivpm ivpm-build
        done
    - name: Fetch source dependencies
      run: |
        export IVPM_PYTHON=/opt/python/cp312-cp312/bin/python
        ${IVPM_PYTHON} -m pip install twine auditwheel build
        ${IVPM_PYTHON} -m ivpm update -j 1 -a
    - name: Build packages
      run: |
        export PATH=/opt/python/cp312-cp312/bin:$PATH
        mkdir build
        cd build
        cmake .. -GNinja
        ninja
    - name: Build Python wheels
      run: |
        for py in cp39-cp39 cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
          /opt/python/${py}/bin/python -m pip install build
          /opt/python/${py}/bin/python -m build --wheel --no-isolation
        done
    - name: Audit Wheels
      run: |
        for whl in dist/*.whl; do
          [ -f "$whl" ] || continue
          /opt/python/cp312-cp312/bin/auditwheel repair $whl
          rm $whl
        done
        if ls wheelhouse/*.whl 2>/dev/null | grep -q .; then
          cp wheelhouse/*.whl dist
        fi
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-linux-aarch64
        path: dist/*.whl
        if-no-files-found: error
    - name: System test
      run: |
        /opt/python/cp313-cp313/bin/python -m venv /tmp/test-venv
        source /tmp/test-venv/bin/activate
        pip install dist/*cp313*.whl
        python -c "from pssparser import Parser; p = Parser(); assert p.parses([('test.pss', 'component pss_top {}')]); print('System test PASSED')"

  ci-win32:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    # find_package(ANTLR) shells out to the antlr jar to detect its version,
    # and the grammars are code-generated with it during the build.
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    - name: Stamp build version
      run: |
        sed -i 's/^SUFFIX = ""$/SUFFIX = ".'"$GITHUB_RUN_ID"'"/' python/pssparser/__version__.py
        grep '^SUFFIX = ' python/pssparser/__version__.py
    - name: Install Packages
      run: |
        python -m pip install ivpm ivpm-build cython ninja cmake wheel setuptools build
        python -m ivpm update -j 1 -a
    # No separate cmake step: build_ext drives its own cmake configure/build/
    # install of the native libraries (Release, prefix=build/) before compiling
    # the extensions.  Running cmake by hand first would only configure the
    # same build dir with different arguments and force a full rebuild.
    - name: Build Python wheel
      run: |
        python -m build --wheel --no-isolation
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-windows
        path: dist/*.whl
        if-no-files-found: error
    - name: System test
      run: |
        python -m venv /c/test-venv
        /c/test-venv/Scripts/pip install dist/*.whl
        /c/test-venv/Scripts/python -c "from pssparser import Parser; p = Parser(); assert p.parses([('test.pss', 'component pss_top {}')]); print('System test PASSED')"

  ci-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Stamp build version
      run: |
        sed -i '' 's/^SUFFIX = ""$/SUFFIX = ".'"$GITHUB_RUN_ID"'"/' python/pssparser/__version__.py
        grep '^SUFFIX = ' python/pssparser/__version__.py
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    - name: Install Packages
      run: |
        python -m pip install ivpm ivpm-build twine cython ninja wheel cmake build
        python -m ivpm update -j 1 -a
    - name: Build
      run: |
        mkdir build
        cd build
        cmake .. -GNinja
        ninja
    - name: Build Python wheel
      run: |
        python -m build --wheel --no-isolation
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-macos
        path: dist/*.whl
        if-no-files-found: error
    - name: System test
      run: |
        python -m venv /tmp/test-venv
        source /tmp/test-venv/bin/activate
        pip install dist/*.whl
        python -c "from pssparser import Parser; p = Parser(); assert p.parses([('test.pss', 'component pss_top {}')]); print('System test PASSED')"

  # A `publish` job stood here. It uploaded every master push to PyPI as
  # <base>.<github-run-id>, and it is DELETED rather than tag-gated.
  #
  # Deleted, because tag-gating it would have created a SECOND path to the
  # same PyPI project, on a different forge, keyed on the same tag. The
  # release-authority switch exists precisely so that only one of the two can
  # fire -- but the cheaper and more legible arrangement, where a repository
  # has an unambiguous release path at all, is one publisher. This repository
  # has one, and it is .forgejo/workflows/ci.yml.
  #
  # The per-push dev-wheel stream goes with it. That was decided estate-wide
  # on 2026-08-27: a release is an explicitly tagged version, and run-id
  # -qualified releases are not something this project does. PyPI still holds
  # the ones already published (3.0.0.27726656373 and friends); nothing new
  # joins them. If a prerelease channel is wanted, it needs designing -- it is
  # explicitly out of scope for this plan, not forgotten.
  #
  # Everything that made the removed job trustworthy already exists on the
  # Forgejo side and is stricter: it checks the tag against BASE in
  # python/pssparser/__version__.py AND against every wheel filename, and it
  # consults the release-authority switch. The wheels this workflow builds are
  # still uploaded as ARTIFACTS above, which is what makes them reviewable
  # without being publishable.

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Sphinx dependencies
      run: |
        python -m pip install sphinx sphinx-rtd-theme
    - name: Build Sphinx docs
      run: |
        sphinx-build -b html docs docs/_build/html
    # A gh-pages deploy stood here, unconditional except for the branch,
    # publishing https://psstools.github.io/pssparser/ on every master push.
    # Deleted: dvkit.org owns documentation for this estate, and the docs job
    # in .forgejo/workflows/ci.yml already uploads the real doc set as the
    # `docs-psstools-pssparser` artifact for the host-side deploy to collect.
    #
    # That one is also the better doc set, and not by a little. It installs
    # the built wheel first, because docs/conf.py uses autodoc to import
    # pssparser.ast and pssparser.core -- compiled Cython extensions that do
    # not exist in a source checkout. The build below is a bare `sphinx-build`
    # over the source tree, so its API reference is empty, and Sphinx exits 0
    # while producing it. Keeping it as a CI check is fine. Publishing it
    # would have been publishing the emptier of the two.
    - name: Sanity-check the docs build
      run: |
        test -s docs/_build/html/index.html \
          || { echo "::error::no index.html in the docs build output"; exit 1; }
        echo "generated pages: $(find docs/_build/html -name '*.html' | wc -l)"
