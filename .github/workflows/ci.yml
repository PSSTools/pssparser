  # ---------------------------------------------------------------------- #
  # THE RELEASE. Restored 2026-09-01, on the authority move described in this
  # file's header -- but NOT the job that used to stand here, and the
  # differences are the whole point.
  #
  # The deleted job published on EVERY MASTER PUSH, as <base>.<run-id>. PyPI
  # still holds what that produced -- 3.0.0.27726656373 and friends -- and
  # nothing new joins them. A release is an explicitly tagged version; that was
  # decided estate-wide on 2026-08-27 and the authority move does not reopen
  # it. If a prerelease channel is ever wanted it needs designing, and this is
  # not it.
  #
  # What this job carries that the deleted one did not, all of it ported from
  # .forgejo/workflows/ci.yml rather than invented here:
  #
  #   * a v* tag gate, so a sync cycle moving the default branch cannot publish
  #   * the release-authority switch, so this and the Forgejo publisher can
  #     never both be armed for the same tag
  #   * tag == BASE in python/pssparser/__version__.py
  #   * every wheel filename == BASE, across every platform artifact
  #
  # AND ONE THING THE FORGEJO JOB CANNOT HAVE: all four platforms. That is the
  # reason the authority moved. `needs` names every build job, so a red macOS
  # build blocks the release rather than shipping three-quarters of it
  # silently -- which is the failure mode a per-artifact publish would have.
  #
  # "All four platforms" became true of the ARTIFACTS at v3.1.0 and true of
  # the COVERAGE after (2026-09-02): the Windows and macOS jobs built a single
  # Python each, so that release carried six linux x86_64 wheels, six linux
  # aarch64, ONE Windows and ONE macOS. Both are matrices now, and the
  # platform-coverage check below fails the release if any of the four goes
  # missing again -- a `needs` edge only proves a job went green, not that it
  # produced anything the merge step could find.
  #
  # ---------------------------------------------------------------------- #
  # ONE TERMINAL JOB FOR BOTH REGISTRIES, and that is a 3.1.3 change worth
  # reading before editing.
  #
  # 3.1.2 was released as two sibling jobs, `publish-pypi` and `publish-npm`,
  # sharing this `needs` list. Sharing the list is not sharing an outcome:
  # whichever finished first committed its half. publish-npm built the
  # WebAssembly package on the runner, the build exhausted memory and took the
  # runner down with it, and the wheels went out alone. PyPI holds 3.1.2 with
  # no npm counterpart and always will.
  #
  # Two registries cannot be written atomically, so the property to aim for is
  # not "both or neither" -- it is that NOTHING FALLIBLE HAPPENS BETWEEN THE
  # TWO UPLOADS. Every build and every check below runs first; the two uploads
  # are the last two steps, adjacent. That takes the window from five minutes
  # of Emscripten compilation down to the seconds between two HTTP requests.
  #
  # THE UPLOADS ARE UNCONDITIONAL, and nothing verifies them afterwards
  # (2026-09-13). A tag is the decision to publish; each upload's exit status
  # is the verdict on whether it worked. That is the whole contract.
  #
  # It replaces a design that tried to be idempotent by inspecting the
  # registry -- an `npm view` pre-check standing in for twine's
  # --skip-existing, and a post-upload step that asked both registries to
  # confirm what they had just been sent. Both consulted npm's READ path,
  # which is advisory and lags the write path: about five minutes at v3.1.3,
  # where npm accepted the upload at 15:15:29 and served nothing until 15:20,
  # to anonymous and authenticated requests alike. The confirm step sampled
  # fifteen seconds in, concluded npm did not have it, and failed the release
  # red with BOTH registries correctly populated -- the most misleading
  # outcome this job can produce. The pre-check had the same flaw pointed the
  # other way: inside that window it would publish a version already present
  # and die on EPUBLISHCONFLICT, breaking the very re-run it existed for.
  #
  # There is no delay that makes a lagging read reliable, only delays that
  # make it slower, so the guessing is gone rather than tuned.
  #
  # THE COST IS REAL AND ACCEPTED: a re-run of a tag whose npm upload already
  # succeeded goes red on EPUBLISHCONFLICT. Recovery from a half-landed
  # release is a new version, not a retry. twine keeps --skip-existing because
  # that is the uploader's own behaviour rather than a guess about registry
  # state, so the PyPI half does still tolerate a replay.
  #
  # npm still goes FIRST: it is the upload with no native resumption, so it
  # happens while the other one can still be replayed cheaply.
  # ---------------------------------------------------------------------- #
  publish:
    # `needs: gate` is what makes the second half of this expression readable
    # at all -- without it needs.gate.outputs.authority is the EMPTY STRING,
    # the condition is false forever, and this job silently never runs again.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.gate.outputs.authority == 'github' }}
    needs: [gate, ci-linux, ci-linux-aarch64, ci-win32, ci-macos, docs]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        # Writes the .npmrc that `npm publish` reads NODE_AUTH_TOKEN through.
        # Without registry-url set, setup-node writes nothing and the publish
        # fails as unauthenticated with the token sitting right there in the
        # environment.
        registry-url: 'https://registry.npmjs.org'
    - name: Setup Java (the C++ front end is generated by ANTLR)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 11

    # ---- Everything that can fail, before anything is published ---------- #

    - name: Resolve the release version from the tag
      # FIRST, because everything below is expressed in terms of $VERSION.
      #
      # This replaces a step that CHECKED tag == BASE == ts/package.json and
      # failed the release when they disagreed. With CI substituting the tag
      # into both files, two of those three are now things this workflow
      # wrote, and a check that a value equals what you just assigned it is
      # not a check. What the lockstep rule actually needs -- that the wheels
      # and the wasm carry ONE version -- is still enforced, but against the
      # ARTIFACTS rather than against the sources: "Check the wheels" asserts
      # every wheel filename carries $VERSION, and the npm tarball check
      # asserts `npm pack` reports it. Those catch a build job whose stamp
      # silently did nothing, which the source comparison could not.
      #
      # VERSION is the tag verbatim, in PEP 440 spelling -- 3.2.0 or 3.2.0rc1
      # -- which is what the wheels carry and what every wheel-name check
      # compares against. The npm spelling is NOT derived here; npm produces
      # it in the next step and it is read back from what npm wrote.
      #
      # NPM_TAG is the one thing a pre-release genuinely needs decided: npm
      # REFUSES to publish a pre-release without --tag ("You must specify a
      # tag using --tag when publishing a prerelease version"), so this is a
      # hard requirement rather than a nicety. It does not quietly assign
      # `latest`, which is the failure mode this would otherwise guard.
      run: |
        set -eu
        tag="${GITHUB_REF#refs/tags/v}"
        # Same grammar the build jobs apply before stamping. Repeated because
        # this job does its own stamping below and must not be the one place a
        # malformed tag gets through.
        bad=0
        case "$tag" in
          *rc*)
            core="${tag%rc*}"
            rcnum="${tag##*rc}"
            case "$core"  in ''|*[!0-9.]*) bad=1 ;; esac
            case "$rcnum" in ''|*[!0-9]*)  bad=1 ;; esac
            npmtag=rc
            ;;
          *)
            case "$tag" in ''|*[!0-9.]*) bad=1 ;; esac
            npmtag=latest
            ;;
        esac
        if [ "$bad" -ne 0 ]; then
          echo "::error::tag v$tag is not <major>.<minor>.<patch> or <major>.<minor>.<patch>rc<N> (PEP 440 spelling: v3.2.0rc1, not v3.2.0-rc1)"
          exit 1
        fi
        echo "releasing $tag under npm dist-tag $npmtag"
        echo "VERSION=$tag"     >> "$GITHUB_ENV"
        echo "NPM_TAG=$npmtag"  >> "$GITHUB_ENV"

    - name: Stamp the npm package version
      # The wheels arrive pre-stamped as build artifacts; the npm package is
      # built HERE, from this job's checkout, so this is where ts/package.json
      # has to be given the tag. `npm version` rather than an edit: it is
      # npm's own mechanism, it updates package-lock.json in step, and it
      # fails loudly on a malformed version instead of writing it.
      #
      # IT IS ALSO THE CONVERTER. Handed the PEP 440 tag `3.2.0rc1`, npm
      # writes the semver form "3.2.0-rc1" -- so the hyphen is inserted by the
      # tool that requires it, not by a sed in this file that would have to be
      # kept in step with semver's rules.
      #
      # VERSION_NPM is then read BACK from what npm wrote, rather than
      # predicted. The cross-check is the assertion that matters: strip
      # hyphens from npm's spelling and it must equal the PEP 440 VERSION, so
      # the two registries cannot end up describing different releases even
      # though they spell this one differently. For a stable release both
      # sides are already identical and the check is trivially true.
      #
      # --no-git-tag-version because we are already on the tag and do not want
      # npm creating another; --allow-same-version so a re-run against an
      # already-stamped tree is not an error.
      working-directory: ts
      run: |
        set -eu
        npm version "$VERSION" --no-git-tag-version --allow-same-version
        npmv=$(node -p "require('./package.json').version")
        if [ "$(printf '%s' "$npmv" | tr -d '-')" != "$VERSION" ]; then
          echo "::error::npm wrote version $npmv, which is not the tag $VERSION in semver spelling"
          exit 1
        fi
        echo "ts/package.json is $npmv (tag $VERSION)"
        echo "VERSION_NPM=$npmv" >> "$GITHUB_ENV"

    - name: Download every platform's wheels
      uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        merge-multiple: true
        path: dist

    - name: Check the wheels
      run: |
        set -eu
        base="$VERSION"
        n=0
        for w in dist/*.whl; do
          case "$(basename "$w")" in
            pssparser-${base}-*) n=$((n+1)) ;;
            *) echo "::error::wheel $(basename "$w") is not version ${base}"; exit 1 ;;
          esac
        done
        # ANTI-VACUITY: an empty dist/ passes the loop above trivially, and
        # `twine upload dist/*.whl` would then fail on an unexpanded glob with
        # a message about no such file -- which reads as a tooling problem
        # rather than as "the build artifacts did not arrive".
        if [ "$n" -eq 0 ]; then
          echo "::error::no wheels were downloaded; the build jobs produced nothing to publish"
          exit 1
        fi
        echo "OK: all ${n} wheels are version ${base}"
        ls -1 dist/*.whl

    - name: Check every platform is represented
      run: |
        set -eu
        fail=0
        check() {
          n=$(ls -1 dist/*.whl | grep -c -- "$2" || true)
          echo "$1: $n wheel(s)"
          if [ "$n" -lt "$3" ]; then
            echo "::error::$1 contributed $n wheels, expected at least $3"
            fail=1
          fi
        }
        check "linux x86_64"  'manylinux.*x86_64'  6
        check "linux aarch64" 'manylinux.*aarch64' 6
        check "windows"       'win_amd64'          4
        check "macos arm64"   'macosx.*arm64'      4
        # A universal2 tag here means the macOS job's tag pinning came
        # undone; the wheel would then be offered to Intel Macs that cannot
        # import it. Caught in the macOS job too -- repeated here because
        # this is the last point before the upload is permanent.
        if ls -1 dist/*.whl | grep -q 'universal2'; then
          echo "::error::a universal2-tagged wheel reached the publish step"
          fail=1
        fi
        [ "$fail" -eq 0 ] || exit 1
        echo "OK: all four platforms represented"

    - name: Fetch source dependencies for the wasm build
      # `-d ts-build` is the only spelling that works, and ivpm records the
      # choice in packages/ivpm.json and refuses a later run asking for a
      # different set. See the dep-set notes in ivpm.yaml.
      run: |
        python -m pip install --quiet ivpm
        ivpm update -a -d ts-build -j 1

    - name: Build the WebAssembly package
      # npm runs `prepare` on a bare `npm install` in the package's own
      # directory, and prepare.mjs is the build: install, generate, tsc. There
      # is no second build command to add here.
      #
      # This is the step that took the runner down at 3.1.2, twice, through an
      # unbounded `make -j`. build-wasm.mjs bounds it now; PSSPARSER_BUILD_JOBS
      # is the override if a runner ever needs a different number.
      working-directory: ts
      run: npm install

    - name: Check what is about to be published to npm
      # ANTI-VACUITY, and the npm counterpart of the wheel checks above.
      # `tsc` emits dist/*.js from the TypeScript wrapper alone, so a cmake
      # failure that somehow survived the step above would leave a dist/ that
      # packs cleanly and throws at the consumer's first parse. Assert the
      # binary is in the tarball, then load it and parse with it.
      working-directory: ts
      #
      # --json, NOT a grep of the `npm notice` listing (2026-09-13). The
      # listing is human-readable output, not an interface: npm has changed
      # its shape across majors, and when it next does, this check does not
      # start failing to find the wasm -- it starts reporting that the wasm is
      # MISSING, which blocks a release that is perfectly fine and sends
      # whoever is on the release looking for a build problem that does not
      # exist. `npm pack --dry-run --json` is the documented machine-readable
      # form and carries name and version as well, so the check can assert
      # what the tarball IS rather than only that a path appears somewhere in
      # a log.
      #
      # The old form also piped through `tee`, which made the pipeline's exit
      # status tee's. `npm pack` failing outright was therefore invisible, and
      # surfaced as the same misleading "no .wasm" message. Redirecting stdout
      # lets `set -e` see the real failure.
      run: |
        set -eu
        npm pack --dry-run --json > /tmp/pack.json
        node -e '
          const fs = require("fs");
          const want = process.env.VERSION_NPM;
          const fail = (m) => { console.error(`::error::${m}`); process.exit(1); };
          let p;
          try { p = JSON.parse(fs.readFileSync("/tmp/pack.json", "utf8"))[0]; }
          catch (e) { fail(`could not parse npm pack --json output: ${e.message}`); }
          if (!p) fail("npm pack --json produced no package entry");
          if (p.name !== "@psstools/pssparser") fail(`tarball is ${p.name}, expected @psstools/pssparser`);
          if (p.version !== want) fail(`tarball is version ${p.version}, expected ${want}`);
          const files = (p.files || []).map((f) => f.path);
          if (!files.includes("dist/wasm/pssparser.wasm")) {
            fail("no dist/wasm/pssparser.wasm in the tarball -- the package would install and fail at runtime");
          }
          console.log(`tarball OK: ${p.name}@${p.version}, ${p.entryCount} files`);
        '
        node --input-type=module -e '
          import { createParser } from "./dist/index.js";
          const p = await createParser();
          p.parseSources([{ name: "ci.pss", content: "component c { action a {} }" }]);
          p.link();
          const errs = p.markers.filter((m) => m.severity === "error");
          if (errs.length) { console.error(`::error::${errs[0].message}`); process.exit(1); }
          p.dispose();
          console.log("the built package parses and links");
        '

    # ---- The two uploads, adjacent and unconditional ---------------------- #

    - name: Publish to npm
      working-directory: ts
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # `npm publish` re-runs `prepare`, which would rebuild everything the
        # steps above just built and verified. This is the case the flag was
        # added for. It also means the artifact published is the artifact
        # checked, rather than a second build that happens to look the same.
        SKIP_PSSPARSER_PREPARE: '1'
      # UNCONDITIONAL. The tag is the decision to publish and `npm publish`'s
      # exit status is the verdict on whether it worked; nothing here inspects
      # the registry to decide what to do, and nothing re-checks afterwards.
      #
      # An `npm view` pre-check used to stand here, meaning to be twine's
      # --skip-existing by hand. It cost v3.1.3 a red release. The read path it
      # asked is advisory and lags the write path -- about five minutes that
      # day -- so it answers "absent" for a version that is present and there
      # is no delay that makes it reliable, only delays that make it slower.
      # Guessing at registry state was the whole defect; the fix is to stop,
      # not to guess more carefully.
      #
      # The cost is explicit: EPUBLISHCONFLICT on a re-run is a FAILURE here,
      # so re-running a tag whose npm upload already succeeded goes red. A
      # release that half-lands is recovered with a new version, not a retry.
      #
      # Access is `public` via publishConfig in ts/package.json. A scoped
      # package defaults to restricted, and npm does not ask -- a restricted
      # first publish of a package meant to be public looks like a success.
      run: |
        set -eu
        if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
          echo "::error::NPM_TOKEN is not available to this repository"
          exit 1
        fi
        npm publish --tag "$NPM_TAG"
        echo "published @psstools/pssparser@${VERSION_NPM} under dist-tag ${NPM_TAG}"

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        set -eu
        if [ -z "${TWINE_PASSWORD:-}" ]; then
          echo "::error::PYPI_API_TOKEN is not available to this repository"
          exit 1
        fi
        python -m pip install --quiet twine
        python -m twine check dist/*.whl
        python -m twine upload --non-interactive --skip-existing dist/*.whl
        echo "published $(ls dist/*.whl | wc -l) wheels"

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install Sphinx dependencies
      run: |
        python -m pip install sphinx sphinx-rtd-theme
    - name: Build Sphinx docs
      run: |
        sphinx-build -b html docs docs/_build/html
    # A gh-pages deploy stood here, unconditional except for the branch,
    # publishing https://psstools.github.io/pssparser/ on every master push.
    # Deleted: dvkit.org owns documentation for this estate, and the docs job
    # in .forgejo/workflows/ci.yml already uploads the real doc set as the
    # `docs-psstools-pssparser` artifact for the host-side deploy to collect.
    #
    # That one is also the better doc set, and not by a little. It installs
    # the built wheel first, because docs/conf.py uses autodoc to import
    # pssparser.ast and pssparser.core -- compiled Cython extensions that do
    # not exist in a source checkout. The build below is a bare `sphinx-build`
    # over the source tree, so its API reference is empty, and Sphinx exits 0
    # while producing it. Keeping it as a CI check is fine. Publishing it
    # would have been publishing the emptier of the two.
    - name: Sanity-check the docs build
      run: |
        test -s docs/_build/html/index.html \
          || { echo "::error::no index.html in the docs build output"; exit 1; }
        echo "generated pages: $(find docs/_build/html -name '*.html' | wc -l)"
