# CI for psstools/pssparser on GitHub Actions.
#
# THIS WORKFLOW IS THE RELEASE PATH, as of 2026-09-01. It publishes to PyPI on
# a `v*` tag, and only when the release-authority switch names this forge --
# sync-policy.toml pins release_authority = "github" for this repository, which
# is the one place both forges read.
#
# WHY IT MOVED BACK, having been on Forgejo since 2026-08-31: WHEELS. This
# package ships a compiled Cython extension, so a release is not one artifact
# but a matrix of them, and .forgejo/workflows/ci.yml builds exactly one --
# linux x86_64, by a scope decision recorded in its own header. Everything
# else this project supports is built HERE: linux aarch64, Windows and macOS.
# Under Forgejo authority a tagged release could only ever carry a quarter of
# its platforms, and `pip install pssparser` on a Mac or on Windows would fall
# back to a source build that cannot succeed without ANTLR and a C++ toolchain.
# The v3.0.7 cycle is the concrete case: the win32 support that made a Windows
# wheel possible was developed and merged here, on the forge that could not
# release it.
#
# The Forgejo publish job is NOT deleted in exchange. It reads the same switch,
# so it disarms itself the moment the switch says "github", and re-arms if the
# switch is ever moved back. Deleting it would make the move one-way for no
# gain; the switch exists precisely so that exactly one of the two can fire.
# What is deliberately NOT restored is the old per-push dev-wheel stream -- see
# the note above `publish-pypi`.

name: CI
on:
  - push
  - pull_request
  - workflow_dispatch
jobs:
  # ---------------------------------------------------------------------- #
  # The release-authority master switch. Resolved in its OWN job because an
  # `if:` on a job cannot reference a step in that same job, so the value has
  # to arrive through `needs.<job>.outputs`.
  #
  # A consumer that reads needs.gate.outputs WITHOUT declaring `needs: gate`
  # gets an EMPTY STRING rather than an error -- the publish condition is then
  # false forever, nothing publishes, and nothing goes red. That is the
  # quietest failure available here, so the shadow check in
  # .forgejo/workflows/conformance.yml asserts the wiring explicitly, across
  # BOTH workflow directories.
  #
  # Deliberately a copy of the Forgejo workflow's `gate` rather than a shared
  # action: this job's entire job is to be the thing that does not depend on
  # the other forge.
  # ---------------------------------------------------------------------- #
  gate:
    name: Release authority
    runs-on: ubuntu-latest
    outputs:
      authority: ${{ steps.resolve.outputs.authority }}
    steps:
      - id: resolve
        # The python is ONE LINE on purpose: a multi-line `python3 -c` body has
        # to start at column 0, which terminates the YAML block scalar above it
        # and silently corrupts the workflow rather than failing to parse.
        run: |
          url=https://dvkit.org/.well-known/release-authority.json
          if ! body=$(curl -fsS --max-time 10 "$url"); then
            # FAIL CLOSED WHEN A RELEASE COULD ACTUALLY HAPPEN, and quietly
            # otherwise. In this org a release is a `v*` TAG, so that -- not
            # the event name -- is the test. Keying on the event name would be
            # wrong in both directions: a tag push IS a push, so it would let a
            # release through unresolved, and every ordinary push would then
            # also be treated as release-critical and fail the build.
            #
            # A release blocked by a dvkit.org outage is recoverable in ten
            # minutes. A version published twice from two forges is not: PyPI
            # lets a version be yanked, never reused.
            case "$GITHUB_REF" in
              refs/tags/v*)
                echo "::error::release-authority switch unreachable; refusing to publish"
                exit 1 ;;
              *)
                echo "authority=none" >> "$GITHUB_OUTPUT"
                echo "switch unreachable, and this ref cannot release; continuing"
                exit 0 ;;
            esac
          fi
          # CASE-FOLDED, and on this forge that is load-bearing rather than
          # defensive. The repository is named `PSSTools/pssparser` on GitHub
          # and `psstools/pssparser` on Forgejo, and $GITHUB_REPOSITORY carries
          # whichever the host thinks it is. sync-policy.toml emits lowercase
          # keys, so an exact-match lookup here MISSES and silently falls
          # through to d["default"] -- returning an authority this repository
          # never pinned, with no error and no clue in the log. Today the
          # default happens to be "github" and the wrong answer coincides with
          # the right one, which is exactly the condition under which this
          # would go unnoticed until the day the default moves.
          auth=$(printf '%s' "$body" | python3 -c 'import json,os,sys; d=json.load(sys.stdin); r=os.environ["GITHUB_REPOSITORY"].lower(); print(d["repos"].get(r) or d["orgs"].get(r.split("/")[0]) or d["default"])')
          echo "release authority for $GITHUB_REPOSITORY: $auth"
          echo "authority=$auth" >> "$GITHUB_OUTPUT"

  ci-linux:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64
    steps:
    - uses: actions/checkout@v4
    - name: Stamp build version
      # Tag builds keep the clean BASE version; everything else gets a
      # .<run-id> dev suffix so an ordinary push can never collide with a
      # release version on PyPI.
      #
      # THE CASE STATEMENT IS NEW (2026-09-01) and it is what makes this forge
      # able to release at all. This step used to stamp UNCONDITIONALLY, which
      # was correct while nothing here published: every wheel was an artifact,
      # and a dev suffix on an artifact costs nothing. The moment `publish-pypi`
      # below exists, an unconditional stamp turns `v3.1.0` into a PyPI upload
      # of 3.1.0.<run-id> -- a version number that cannot be reused once taken.
      # The tag/version check in that job would in fact catch it and fail the
      # release, which is the recoverable direction, but only after a full
      # matrix build.
      run: |
        case "$GITHUB_REF" in
          refs/tags/*) echo "tag build -- leaving version clean" ;;
          *) sed -i 's/^SUFFIX = ""$/SUFFIX = ".'"$GITHUB_RUN_ID"'"/' python/pssparser/__version__.py ;;
        esac
        grep '^SUFFIX = ' python/pssparser/__version__.py
    - name: Install additional build dependencies
      run: |
        yum install -y libuuid-devel
        yum install -y java-11-openjdk-devel
        for py in cp39-cp39 cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
          /opt/python/${py}/bin/python -m pip install ninja wheel cython setuptools ivpm ivpm-build
        done
    - name: Fetch source dependencies
      run: |
        export IVPM_PYTHON=/opt/python/cp312-cp312/bin/python
        ${IVPM_PYTHON} -m pip install twine auditwheel build
        ${IVPM_PYTHON} -m ivpm update -j 1 -a
    - name: Build packages
      run: |
        export PATH=/opt/python/cp312-cp312/bin:$PATH
        mkdir build
        cd build
        cmake .. -GNinja
        ninja
    - name: Build Python wheels
      run: |
        for py in cp39-cp39 cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314; do
          /opt/python/${py}/bin/python -m pip install build
          /opt/python/${py}/bin/python -m build --wheel --no-isolation
        done
    - name: Audit Wheels
      run: |
        for whl in dist/*.whl; do
          [ -f "$whl" ] || continue
          /opt/python/cp312-cp312/bin/auditwheel repair $whl
          rm $whl
        done
        if ls wheelhouse/*.whl 2>/dev/null | grep -q .; then
          cp wheelhouse/*.whl dist
        fi
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-linux-x86_64
        path: dist/*.whl
        if-no-files-found: error
    - name: Check the PSS corpus
      # VERIFIES the corpus; it does not fetch it. ivpm.yaml declares
      # pss-corpus in `default-dev`, and "Fetch source dependencies" runs
      # `ivpm update -a`, which resolves the dev set -- so the corpus arrives
      # the same way every other dependency does.
      #
      # A hand-written `git clone https://git.dvkit.org/...` stood here. It
      # dated from before C-2a landed, when the psstools/pss-corpus mirror
      # ivpm.yaml names did not resolve. Now that it does, ivpm clones the
      # corpus first and the clone died on "destination path already exists".
      # Deleted rather than made conditional: ivpm.yaml is where this
      # repository says what it depends on and where it comes from, and a
      # second fetch path in CI is a place for the two to disagree. It also
      # took this workflow off git.dvkit.org, which was the one point where it
      # reached outside GitHub.
      #
      # The check itself stays. tests/python/corpus/test_pss_corpus.py fails
      # rather than skips on an absent corpus (pss-corpus PLAN.md C-8), but it
      # runs two steps and several minutes later; failing here says "the
      # dependency did not arrive" instead of "a sweep found nothing".
      run: |
        set -eu
        n=$(find packages/pss-corpus/curated -name '*.pss' | wc -l)
        echo "corpus: $n .pss files"
        if [ "$n" -lt 50 ]; then
          echo "::error::corpus resolved but looks wrong ($n files, expected 50+)"
          exit 1
        fi

    - name: Run Python tests
      # PYTHONPATH points at the ivpm checkout of pyastbuilder because
      # tests/python/test_astbuilder_codegen.py imports `astbuilder`, the AST
      # code generator, which is a BUILD-time tool and so is deliberately not
      # in the wheel. Without it the module fails at import and pytest exits 2
      # on a collection error -- taking all 3276 tests with it, not just this
      # one.
      #
      # The ivpm checkout rather than `pip install pyastbuilder`, even though
      # PyPI has one. That test asserts on generated source in order to pin
      # defects in the generator, so it is only meaningful against the same
      # generator that produced this build's AST -- which is the checkout that
      # scripts/gen_ast.py ran from. Installing a release would let the tool
      # under test and the tool that built the artifact drift apart silently.
      #
      # This does not weaken testing against the installed wheel: that
      # directory contains `astbuilder` and nothing else, so `pssparser` still
      # resolves from the wheel installed below.
      #
      # pyyaml and toposort are astbuilder's own imports (parser.py, linker.py).
      run: |
        for py in cp312-cp312 cp313-cp313; do
          /opt/python/${py}/bin/python -m pip install pytest pyyaml toposort dist/*${py%%-*}*.whl
          PYTHONPATH="$PWD/packages/pyastbuilder/src" \
            /opt/python/${py}/bin/python -m pytest tests/python -v --tb=short
        done
    - name: System test
      run: |
        /opt/python/cp313-cp313/bin/python -m venv /tmp/test-venv
        source /tmp/test-venv/bin/activate
        pip install dist/*cp313*.whl
        python -c "from pssparser import Parser; p = Parser(); assert p.parses([('test.pss', 'component pss_top {}')]); print('System test PASSED')"

