  ci-win32:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    # find_package(ANTLR) shells out to the antlr jar to detect its version,
    # and the grammars are code-generated with it during the build.
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    - name: Stamp build version
      # Tag builds keep the clean BASE version; everything else gets a
      # .<run-id> dev suffix so an ordinary push can never collide with a
      # release version on PyPI.
      #
      # THE CASE STATEMENT IS NEW (2026-09-01) and it is what makes this forge
      # able to release at all. This step used to stamp UNCONDITIONALLY, which
      # was correct while nothing here published: every wheel was an artifact,
      # and a dev suffix on an artifact costs nothing. The moment `publish-pypi`
      # below exists, an unconditional stamp turns `v3.1.0` into a PyPI upload
      # of 3.1.0.<run-id> -- a version number that cannot be reused once taken.
      # The tag/version check in that job would in fact catch it and fail the
      # release, which is the recoverable direction, but only after a full
      # matrix build.
      run: |
        case "$GITHUB_REF" in
          refs/tags/*) echo "tag build -- leaving version clean" ;;
          *) sed -i 's/^SUFFIX = ""$/SUFFIX = ".'"$GITHUB_RUN_ID"'"/' python/pssparser/__version__.py ;;
        esac
        grep '^SUFFIX = ' python/pssparser/__version__.py
    - name: Install Packages
      run: |
        python -m pip install ivpm ivpm-build cython ninja cmake wheel setuptools build
        python -m ivpm update -j 1 -a
    # No separate cmake step: build_ext drives its own cmake configure/build/
    # install of the native libraries (Release, prefix=build/) before compiling
    # the extensions.  Running cmake by hand first would only configure the
    # same build dir with different arguments and force a full rebuild.
    - name: Build Python wheel
      run: |
        python -m build --wheel --no-isolation
    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-windows
        path: dist/*.whl
        if-no-files-found: error
    - name: System test
      run: |
        python -m venv /c/test-venv
        /c/test-venv/Scripts/pip install dist/*.whl
        /c/test-venv/Scripts/python -c "from pssparser import Parser; p = Parser(); assert p.parses([('test.pss', 'component pss_top {}')]); print('System test PASSED')"

