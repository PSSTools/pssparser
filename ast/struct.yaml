
enums:
- StructKind:
    doc: |
        The keyword a `struct_declaration` starts with (LRM 7.8, `struct_kind`):
        `struct`, or one of the `object_kind` keywords that declare a flow
        object (LRM 9.3) or a resource object (LRM 9.4).
    values:
    - Buffer: "`buffer` -- a buffer flow object (LRM 9.3.1)"
    - Struct: "`struct` -- a plain data structure (LRM 7.8)"
    - Resource: "`resource` -- a resource object (LRM 9.4)"
    - Stream: "`stream` -- a stream flow object (LRM 9.3.2)"
    - State: "`state` -- a state flow object (LRM 9.3.3)"

classes:
- Struct:
    super: TypeScope
    doc: |
        A struct-like type declaration: `struct`, `buffer`, `stream`, `state`
        or `resource` (LRM 7.8, `struct_declaration`).

        All five share one syntax; `kind` records which keyword was used,
        and so whether the type is plain data, a flow object (LRM 9.3) or a
        resource object (LRM 9.4). Body items (attribute fields,
        constraints, exec blocks, covergroups, ...) are the children.

        PSS Example::

            struct packet_s {
                bit[8] header;
                bit[32] payload;
            }

            buffer dma_buf_t {
                rand int in [1..64] size;
            }

            resource bus_t {
                int bandwidth;
            }

            stream data_stream_t {
                bit[16] samples;
            }

            state session_state_t {
                bool connected;
            }

        Attributes:
            name: Type name (inherited from NamedScope via TypeScope)
            super_t: Optional base type (inherited from TypeScope)
            children: Body items (inherited from Scope)

        See Also:
            StructKind, TypeScope, Field
    data:
    - kind:
        type: StructKind
        doc: |
            Which keyword declared the type (`struct`, `buffer`, `stream`,
            `state` or `resource`). Always set by the parser.
