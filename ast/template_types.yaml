
enums:
  - TypeCategory:
      doc: |
        The type category a category type parameter is restricted to (LRM 10.3.2,
        `type_category`). The `ref_type_category` keywords are `action`,
        `monitor`, `component` and the object kinds (`buffer`, `resource`,
        `state`, `stream`); the `plain_type_category` keywords are `struct` and
        `numeric`. A template argument for the parameter must be a type of this
        category (checked by the linker, TaskBuildParamValList).
      values:
        - Action: "`action` -- the argument must be an action type"
        - Component: "`component` -- the argument must be a component type"
        - Buffer: "`buffer` -- the argument must be a buffer object type"
        - Resource: "`resource` -- the argument must be a resource object type"
        - State: "`state` -- the argument must be a state object type"
        - Stream: "`stream` -- the argument must be a stream object type"
        - Struct: "`struct` -- the argument must be a plain struct type (not a buffer, resource, state or stream)"
        - Monitor: "`monitor` -- the argument must be a monitor type (PSS 3.1; a `ref_type_category`)"
        - Numeric: "`numeric` -- the argument must be a numeric type (PSS 3.1; a `plain_type_category`, which takes no type restriction)"

classes:

  - TemplateParamDeclList:
      doc: |
        The template parameter list of a template generic type (LRM 10.2,
        `template_param_decl_list`).

        The parser builds one for each `< ... >` written after the name in a
        struct (or buffer, resource, state, stream), action, component, monitor
        or annotation declaration, and stores it in the type's TypeScope
        `params` field. Its presence is what makes the type generic.
        BuiltinsFactory builds lists for the built-in generic types (`array`,
        `list`, `set`, `map`).

        The linker reuses the class for each specialization: when it
        specializes a generic for a set of template arguments
        (TaskSpecializeParameterizedRef, TaskBuildParamValList) it builds a new
        list in which each parameter's `dflt` holds the argument bound to it,
        sets `specialized`, and installs the list on the specialized copy of
        the type (TaskGetSpecializedTemplateType).

        PSS Example::

            struct my_s <type T, int N = 4> {   // T: generic, N: value
                T vals[N];
            }

            buffer base_buff { }

            component pss_top {
                // B: category type parameter restricted to base_buff
                action consumer <buffer B : base_buff> {
                    input B in_b;
                }
            }

        Attributes:
            params: The parameter declarations, in source order
            specialized: False on the list written in the source. True on a
                list the linker built for a specialization, where every
                parameter is bound to a template argument.

        See Also:
            TemplateParamDecl, TemplateGenericTypeParamDecl, TemplateCategoryTypeParamDecl,
            TemplateValueParamDecl, TypeScope, TemplateParamValueList
      data:
      - params: list<UP<TemplateParamDecl>>
      - specialized:
          type: bool
          init: false
          is_ctor: false

  - TemplateParamDecl:
      super: ScopeChild
      doc: |
        Base class for one template parameter declaration (LRM 10.3,
        `template_param_decl`).

        A template parameter is either a type parameter -- generic (`type T`)
        or restricted to a type category (`action A`, `struct S : base_s`) --
        or a value parameter (`int N`). Every parameter has a name and an
        optional default. The parser sets the node's location to that of the
        name, and attaches a preceding doc comment to it.

        PSS Example::

            struct my_s <type T, int N = 4> {
                T vals[N];
            }

            component pss_top {
                action container <action A> {
                    activity { do A; }
                }
            }

        Attributes:
            name: The parameter's identifier. In a specialized list built by
                the linker it is a copy of the declaration's name.

        See Also:
            TemplateGenericTypeParamDecl, TemplateCategoryTypeParamDecl,
            TemplateValueParamDecl, TemplateParamDeclList
      data:
      - name: UP<ExprId>

  - TemplateGenericTypeParamDecl:
      super: TemplateParamDecl
      doc: |
        A generic type parameter, declared with the `type` keyword (LRM 10.3.2,
        `generic_type_param_decl`).

        The parameter can be bound to any type. The LRM allows a
        `type_identifier` as the default; the grammar accepts any `data_type`,
        so built-in types such as `bit[32]` are also accepted as defaults.

        In a specialized TemplateParamDeclList the linker uses this class for
        *every* type parameter, including one declared with a type category:
        once the argument has been checked against the category, only the
        binding is kept.

        PSS Example::

            struct gen_s <type T = bit[32]> {
                T data;
            }

            component pss_top {
                gen_s<bit[8]> g8;
                gen_s<>       g32;   // T takes its default, bit[32]
            }

        Attributes:
            name: Identifier for the type parameter (inherited)
            dflt: The default type after `=`, or null when none is written. In
                a specialized list, the type argument bound to the parameter.

        See Also:
            TemplateCategoryTypeParamDecl, TemplateParamDecl, DataType
      data:
      - dflt: UP<DataType>

  - TemplateCategoryTypeParamDecl:
      super: TemplateParamDecl
      doc: |
        A type parameter restricted to a type category (LRM 10.3.2,
        `category_type_param_decl`).

        The keyword before the name -- `action`, `monitor`, `component`,
        `buffer`, `resource`, `state`, `stream`, `struct` or `numeric` -- is
        the category: an argument must be a type of that category. An optional
        `type_restriction` (`: type_identifier`) further requires the argument
        to be that type or derive from it. The linker checks both when it
        specializes the generic (TaskBuildParamValList); the argument check
        only applies to arguments that resolve to a declared type.

        PSS Example::

            buffer base_buff { rand int x; }
            buffer data_buff : base_buff { }

            component pss_top {
                action consumer <buffer B : base_buff = data_buff> {
                    input B in_b;
                }
            }

            component wrap_c <struct cfg_s, bool full_duplex = true> { }

        Attributes:
            name: Identifier for the type parameter (inherited)
            category: The type category keyword. A keyword the builder's
                table does not know falls back to Struct.
            restriction: The type after `:`, or null when the parameter has no
                `type_restriction`. Its target is set by the linker.
            dflt: The default type after `=`, or null when none is written.
                The grammar takes a `type_identifier` here, which the parser
                wraps in a DataTypeUserDefined.

        See Also:
            TemplateGenericTypeParamDecl, TypeCategory, TypeIdentifier
      data:
      - category: TypeCategory
      - restriction: UP<TypeIdentifier>
      - dflt: UP<DataType>

  - TemplateValueParamDecl:
      super: TemplateParamDecl
      doc: |
        A value template parameter (LRM 10.3.1, `value_param_decl`).

        The parameter takes a constant value rather than a type. Its data type
        must be a scalar type other than `chandle`, and it can be referenced
        anywhere a constant expression is allowed in the template type's body
        and super-type specification. A default may refer to earlier
        parameters; a default that is a `<` or `>` comparison must be
        parenthesized.

        PSS Example::

            struct my_s <type T, int N = 4> {
                T vals[N];
            }

            component pss_top {
                action my_a <int width, bool is_wide = (width > 10)> { }

                my_s<bit[8], 8> s1;
                my_s<int>       s2;      // N takes its default, 4
            }

        Attributes:
            name: Identifier for the value parameter (inherited)
            type: The parameter's declared data type
            dflt: The default `constant_expression` after `=`, or null when
                none is written. In a specialized list, the value argument
                bound to the parameter.

        See Also:
            TemplateGenericTypeParamDecl, TemplateParamExprValue, DataType
      data:
      - type: UP<DataType>
      - dflt: UP<Expr>

  - TemplateParamValueList:
      doc: |
        The template arguments written after a generic type's name (LRM 10.4,
        `template_param_value_list`).

        The parser builds one for each `< ... >` on a `type_identifier_elem`
        and stores it in the TypeIdentifierElem's `params`. The argument list
        may be empty (`my_s<>`), in which case every parameter takes its
        default. The parser also synthesizes lists: an array declaration
        `T a[N]` becomes `array<T, N>`, and BuiltinsFactory builds `list<T>`
        types the same way.

        PSS Example::

            struct my_s <type T, int N = 4> {
                T vals[N];
            }

            component pss_top {
                my_s<bit[16], 8> s1;   // values: bit[16] (type), 8 (expression)
                my_s<int>        s2;   // N takes its default
            }

        Attributes:
            values: The arguments, in source order. Each is matched to the
                template parameter in the same position by the linker.

        See Also:
            TemplateParamValue, TemplateParamTypeValue, TemplateParamExprValue,
            TemplateParamDeclList, TypeIdentifierElem
      data:
      - values: list<UP<TemplateParamValue>>

  - TemplateParamValue:
      doc: |
        Base class for one template argument (LRM 10.4, `template_param_value`).

        An argument is either a type (TemplateParamTypeValue) or a constant
        expression (TemplateParamExprValue). The grammar cannot always tell
        which: a bare name such as `K` spells both, and the parser builds a
        TemplateParamTypeValue for it. The linker decides from what the name
        resolves to and from the parameter it is matched with
        (TaskBuildParamValList), so a TemplateParamTypeValue can supply a value
        parameter.

        PSS Example::

            const int K = 3;
            struct my_s <type T, int N = 4> {
                T vals[N];
            }

            component pss_top {
                my_s<bit[32], 10> s1;  // TemplateParamTypeValue, TemplateParamExprValue
                my_s<bit[32], K>  s2;  // K builds a TemplateParamTypeValue
            }

        See Also:
            TemplateParamTypeValue, TemplateParamExprValue, TemplateParamValueList

  - TemplateParamTypeValue:
      super: TemplateParamValue
      doc: |
        A template argument parsed as a data type (the `data_type`
        alternative of `template_param_value`).

        Supplies a type parameter, generic or category-restricted. Because a
        bare identifier parses as a type, it is also what the parser builds for
        a named constant or enum item given to a value parameter; the linker
        treats it as a value when the name resolves to one.

        PSS Example::

            struct my_s <type T, int N = 4> {
                T vals[N];
            }
            struct inner_s <type T> { T value; }

            component pss_top {
                my_s<bit[16]>         s1;   // bit[16]: built-in type
                my_s<inner_s<int>, 2> s2;   // inner_s<int>: user-defined type
            }

        Attributes:
            value: The argument's data type

        See Also:
            TemplateParamValue, TemplateParamExprValue, DataType,
            TemplateGenericTypeParamDecl, TemplateCategoryTypeParamDecl
      data:
        - value: UP<DataType>

  - TemplateParamExprValue:
      super: TemplateParamValue
      doc: |
        A template argument parsed as a constant expression (the
        `constant_expression` alternative of `template_param_value`).

        Supplies a value parameter. The parser builds it for anything that is
        not also a data type -- a literal or a compound expression; a bare
        name is parsed as a TemplateParamTypeValue instead. The linker resolves
        the expression at the use site and copies it into the specialization.

        PSS Example::

            struct my_s <type T, int N = 4> {
                T vals[N];
            }

            component pss_top {
                my_s<bit[8], 16>  s1;   // a literal
                my_s<int, 2+3>    s2;   // an expression
            }

        Attributes:
            value: The argument expression

        See Also:
            TemplateParamValue, TemplateParamTypeValue, Expr, TemplateValueParamDecl
      data:
        - value: UP<Expr>



