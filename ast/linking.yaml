- SymbolImportSpec:
    set_by: linker   # constructed only by the linker (TaskBuildSymbolTree et al.)
    doc: |
        The package imports that apply in a symbol scope (SymbolScope.imports).

        Created by TaskBuildSymbolTree the first time it meets an `import`
        statement in a scope. Every import is kept, a repeated one too. The
        imports themselves are resolved in place: TaskResolveImports sets the
        target of each statement's `path`, and name lookup searches the
        imported scopes (LRM 18.3).

        Attributes:
            imports: The PackageImportStmt nodes, in source order; not owned
            symtab: Meant to map imported names to their resolved symbol
                paths. Not filled by the linker (only copied when a scope
                is cloned); always empty

        See Also:
            SymbolRefPath, PackageImportStmt, SymbolScope
    data:
    - imports:
      - type: list<P<PackageImportStmt>>
      - rel: ref
    - symtab:
      - type: map<string,UP<SymbolRefPath>>
      - is_ctor: false

