- SymbolTypeScope:
    set_by: linker   # constructed only by the linker (TaskBuildSymbolTree et al.)
    doc: |
        Symbol scope for type declarations (actions, components, structs).

        Represents a user-defined type in the linked symbol tree, managing its
        members, methods, and constraints. Supports template specialization by
        tracking parameter lists and specialized type instantiations. Built
        for each TypeScope by TaskBuildSymbolTree::visitTypeScope (synthetic,
        `target` the declaration); the builtin types `array`, `list`, `map`,
        `set`, `string` and `pyobj` have one too.

        During linking, type declarations from multiple files can be merged
        (for extend statements) and specialized instances are tracked separately.
        The plist holds template parameters, while spec_types contains any
        specialized/instantiated versions of this generic type.

        Attributes:
            plist: Template parameter list scope, named `<plist>`, holding the
                TemplateParamDecl nodes of a generic type (`ElemKind_ParamIdx`
                indexes it); null for a non-template type
            spec_types: The specializations of this generic type, one per
                distinct argument list used, in the order they were first
                needed (`ElemKind_TypeSpec` indexes it). Built by the linker
                (TaskGetSpecializedTemplateType); empty for a non-template
                type

        See Also:
            SymbolScope, Action, Component, Struct, SymbolExtendScope, SymbolExtMember
    super: SymbolScope
    data:
      - plist:
        - type: UP<SymbolScope>
      - spec_types: list<UP<SymbolTypeScope>>
      - ext_members:
        - doc: |
            Every named member an extension contributed to this type, in merge
            order, with the package of its extension (LRM 17.2, 17.2.3).
            Two packages may each add a field or type of one name, so the
            single-valued symtab cannot hold them all: it keeps the initial
            definition's members and the first extension member of each
            name. Empty for a type no extension added a named member to.
        - type: list<UP<SymbolExtMember>>
        - is_ctor: false
        - visit: false

- SymbolExtMember:
    set_by: linker   # constructed only by the linker (TaskBuildSymbolTree et al.)
    doc: |
        A member an extension contributed to a type (SymbolTypeScope.ext_members).

        Recorded by TaskApplyTypeExtensions when it merges an `extend`
        statement's named member into the type's symbol scope, so that name
        lookup can tell members of one name apart by the package of the
        extension that declared them (LRM 17.2.3).

        PSS Example::

            package p1 { extend component pss_top { int x; } }
            package p2 { extend component pss_top { int x; } }  // a second `x`

        Attributes:
            name: The member's name
            idx: Its index in the type's children
            pkg: The nearest package enclosing the extension statement (17.2);
                the root scope for an extension outside any package

        See Also:
            SymbolTypeScope, SymbolExtendScope, ExtendType
    data:
    - name:
      - type: string
    - idx:
      - type: int32_t
    - pkg:
      - type: P<SymbolScope>
      - rel: ref
      - visit: false

- SymbolFunctionScope:
    set_by: linker   # constructed only by the linker (TaskBuildSymbolTree et al.)
    doc: |
        Symbol scope for functions with overload resolution support.

        Represents a function in the linked symbol tree, collecting every
        declaration of one function name: prototypes, `import` declarations,
        and the definition. There is one such scope per function name, not
        one per signature: later declarations must agree with the first,
        which the linker checks (TaskBuildSymbolTree).

        During linking, function prototypes from different files are collected,
        import specifications are recorded, and the body (if present) is
        linked. The plist holds the function's parameters. Built by
        TaskBuildSymbolTree (visitFunctionDefinition, visitFunctionPrototype,
        visitFunctionImportProto, visitTargetTemplateFunction).

        PSS Example::

            function int add(int a, int b);                 // a prototype
            function int add(int a, int b) { return a+b; }  // the definition

        Attributes:
            prototypes: Every FunctionPrototype declared for the name; a
                definition's prototype is put first
            import_specs: One FunctionImport per `import ... function`
                declaration of the function, recording its platform
                qualifier (`solve` or `target`); owned copies made by the
                linker, with an empty language
            definition: Meant to point to the FunctionDefinition. Not set
                by the linker: it is always null; the definition is
                `target`, and its body is `body`
            plist: The function's parameters: a scope named `<plist>`
                holding the FunctionParamDecl nodes of the first prototype
                seen, re-bound to a definition's own parameter names
                (`ElemKind_ArgIdx` indexes it)
            body: The ExecScope of the function's definition; null for a
                function that is only declared, imported, or a target
                template. Reached by an `ElemKind_ChildIdx` step equal to
                the number of children

        See Also:
            SymbolScope, FunctionPrototype, FunctionDefinition, FunctionImport
    super: SymbolScope
    data:
      - prototypes:
        - type: list<P<FunctionPrototype>>
        - rel: ref
        - is_ctor: false
      - import_specs:
        - type: list<UP<FunctionImport>>
        - is_ctor: false
      - definition:
        - type: P<FunctionDefinition>
        - rel: ref
        - is_ctor: false
        - init: 0
      - plist:
        - type: UP<SymbolScope>
        - is_ctor: false
      - body:
        - type: P<ExecScope>
        - rel: ref
        - is_ctor: false
        - init: 0

- SymbolRefPath:
    set_by: linker   # constructed only by the linker (TaskBuildSymbolTree et al.)
    doc: |
        Structured path for navigating between symbols during linking.

        Encodes a resolved reference as a sequence of navigation steps through
        the linked symbol tree. It is what the linker stores in a resolved
        reference (a TypeIdentifier's `target`, a reference path's
        `target`); TaskResolveSymbolPathRef turns it back into the node it
        names.

        Rather than storing string-based qualified names, SymbolRefPath provides
        an efficient index-based navigation structure. This enables fast symbol
        lookup during compilation without repeated name searches.

        The path elements specify how to navigate from the root scope to the
        target symbol (e.g., "child 0, child 2, type specialization 1").

        Attributes:
            path: Sequence of navigation steps to reach the target symbol,
                starting at the RootSymbolScope (or, after an
                `ElemKind_Inline` first step, at the in-line context)
            pyref_idx: -1 for an ordinary reference. Set to 0 by the linker
                (TaskResolveRefs) when an element of the path is a value of
                the Python object type `pyobj` (TaskIsPyRef): the rest of the
                reference is dynamic and is not resolved

        See Also:
            SymbolRefPathElem, SymbolScope, TypeIdentifier
    data:
    - path:
      - type: list<SymbolRefPathElem>
      - is_ctor: false
      - visit: false
    - pyref_idx:
      - type: int32_t
      - is_ctor: false
      - init: -1

