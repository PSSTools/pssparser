[metadata]
name = pss-rule-collection
version = 0.1.0
description = Example pssparser extension: a collection of checkers in one package
long_description = file: README.rst
long_description_content_type = text/x-rst
author = Example Author
license = Apache-2.0

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
install_requires =
    pssparser

[options.packages.find]
where = src

# One entry point for the whole collection.  The key is the extension name
# shown by `pssparser --list-extensions`; the value is the module exposing
# register(registry).  Contrast with the legacy `pssparser.checkers` group,
# which needs one line per checker class.
[options.entry_points]
pssparser.extensions =
    example-rules = pss_rules
