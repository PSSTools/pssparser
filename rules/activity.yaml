# Activity rules (lint-framework-plan.md F3.5): LINT2xx.
pss-rules:
  version: 1

  defaults:
    family: activity
    tier: nursery
    since: "2026.1"

  rules:
    - id: LINT201
      name: degenerate-activity-statement
      summary: An activity statement that does nothing, or adds nothing over its body
      message: >-
        ${node.isa(ActivityRepeatCount) ? "this 'repeat' runs its body zero times, so it does nothing"
          : node.isa(ActivityRepeatWhile) ? (const_bool(node.cond).orValue(false)
            ? "this 'repeat ... while' condition is always true, so the loop never ends"
            : "this 'repeat ... while' condition is always false, so the body runs exactly once")
          : size(branches(node)) == 0
            ? "this empty '" + kw + "' does nothing"
            : "this '" + kw + "' has one branch, so it is the same as the branch alone"}
      doc: |
        A statement whose control flow is decided by its own text:

        - `repeat (0)` never runs its body (11.4.1 b).
        - `repeat { ... } while (false)` runs its body exactly once; with
          `while (true)` it never ends, since an activity has no `break`
          (11.4.2).
        - `select`, `parallel` and `schedule` with one branch behave as that
          branch alone (11.3.4, 11.3.5, 11.4.4); with none, they do nothing.
          A one-branch `parallel` or `schedule` with a join specification
          (`join_none`, ...) is not reported: it changes what follows the
          statement waits for (11.3.6). Nor is one whose branch is a
          `replicate`, which expands into several branches (11.5.1).

        Each is usually left over from an edit: a branch was removed, or a
        count was set to zero to disable a loop. (The grammar gives `select`
        at least two branches (11.4.4); pssparser accepts one today, and may
        make it an error later.) Write the
        branch on its own, or remove the statement. To keep a disabled loop
        visible, waive the finding at the statement:
        `@lint_pkg::waive {.id = "degenerate-activity-statement", .reason = "..."}`.

        Counts and conditions are judged only when they fold to a constant:
        `repeat (N)` with `N` a constant that happens to be zero is reported,
        a count read from a field is not.
      lrm: ["11.3.4", "11.3.5", "11.4.1", "11.4.2", "11.4.4", "11.5.1"]
      match: { kind: [ActivityRepeatCount, ActivityRepeatWhile, ActivitySelect, ActivityParallel, ActivitySchedule] }
      let:
        # A join specification changes what the statement waits for, so a
        # one-branch `parallel join_none` is not the branch alone.
        joins: >-
          node.isa(ActivityParallel) ? has(node.join_spec)
          : node.isa(ActivitySchedule) ? has(node.join_spec) : false
        kw: >-
          node.isa(ActivitySelect) ? "select" : node.isa(ActivityParallel) ? "parallel" : "schedule"
      where: >-
        node.isa(ActivityRepeatCount) ? const_int(node.count).orValue(1) == 0
        : node.isa(ActivityRepeatWhile)
          ? const_bool(node.cond).hasValue() || const_int(node.cond).orValue(1) == 0
        : size(branches(node)) == 0
          || size(branches(node)) == 1 && !joins && !branches(node)[0].body.isa(ActivityReplicate)
      examples:
        - name: a disabled loop and single-branch statements
          code: |
            component pss_top {
              static const int N = 0;
              action Sub { }
              action A {
                activity {
                  repeat (N) { do Sub; }          // expect: LINT201
                  repeat { do Sub; } while (false); // expect: LINT201
                  repeat { do Sub; } while (true);  // expect: LINT201
                  select { do Sub; }              // expect: LINT201
                  parallel { do Sub; }            // expect: LINT201
                  schedule { }                    // expect: LINT201
                }
              }
            }
        - name: counts and conditions that are not constant, and two branches
          code: |
            component pss_top {
              action Sub { }
              action A {
                rand bit[4] n;
                activity {
                  repeat (n) { do Sub; }
                  repeat { do Sub; } while (n > 2);
                  repeat (2) { do Sub; }
                  select { do Sub; do Sub; }
                  parallel { do Sub; do Sub; }
                  parallel join_none { do Sub; }
                  parallel { replicate (n) { do Sub; } }
                }
              }
            }

    - id: LINT202
      name: unreachable-select-branch
      summary: A select branch whose guard is always false or whose weight is zero
      message: >-
        ${finding == node
          ? "no branch of this 'select' can be chosen, which is an error when it runs"
          : !const_bool(guard_of(finding)).orValue(true)
            ? "this branch's guard is always false, so the branch is never selected"
            : "this branch's weight is zero, so the branch is never selected"}
      doc: |
        A `select` branch is enabled only when its guard is true (11.4.4 b),
        and is chosen with probability weight / sum of the enabled weights
        (11.4.4 d), so a branch whose guard folds to `false`, or whose weight
        folds to `0`, is never selected. That is usually a branch disabled
        by hand and forgotten, or a constant that changed under it.

        When no branch can be selected the `select` is illegal (11.4.4 f):
        the finding is then reported once, at the `select`.

        Only constant guards and weights are judged. To disable a branch
        on purpose, remove it, or waive the finding on the branch:
        `@lint_pkg::waive {.id = "unreachable-select-branch", .reason = "..."}`.
      lrm: ["11.4.4"]
      match: { kind: ActivitySelect }
      define:
        dead(b): >-
          !const_bool(b.guard).orValue(true) || const_int(b.weight).orValue(1) == 0
        guard_of(n): >-
          branches(node).filter(b, b.body == n).map(b, b.guard)[0]
      let:
        all: branches(node)
        gone: all.filter(b, dead(b))
      report: >-
        size(gone) > 0 && size(gone) == size(all) ? [node] : gone.map(b, b.body)
      examples:
        - name: a false guard, a zero weight, and a select with nothing left
          code: |
            component pss_top {
              static const bool ENABLE_B = false;
              action Sub { }
              action A {
                rand bit[4] m;
                activity {
                  select {
                    (m > 0): do Sub;
                    (ENABLE_B): do Sub;   // expect: LINT202
                    [0]: do Sub;          // expect: LINT202
                    [2]: do Sub;
                  }
                  select {                // expect: LINT202
                    (false): do Sub;
                    [0]: do Sub;
                  }
                }
              }
            }
        - name: guards and weights that are not constant
          code: |
            component pss_top {
              action Sub { }
              action A {
                rand bit[4] m;
                activity {
                  select {
                    (m > 0)[m]: do Sub;
                    (true)[1]: do Sub;
                    do Sub;
                  }
                }
              }
            }

    - id: LINT203
      name: overlapping-activity-match
      summary: An activity match choice whose values overlap an earlier choice's
      message: >-
        this choice's values overlap the choice on line ${string(first_overlap(finding).body.location.lineno)},
        and a value both cover traverses one of them at random
      doc: |
        When more than one choice of an activity `match` covers the value of
        the match expression, one of the matching choices is traversed at
        random (11.4.6 d). The same overlap in a procedural `match` is an
        error (20.7.10), so in an activity it is easy to write by accident
        and read as "first match wins", which PSS does not do.

        Only choices whose ranges fold to constants are compared; a choice
        such as `[m]` that depends on the model is not.

        If a random choice between the overlapping branches is intended,
        say so with a `select` and guards, which states the choice
        directly, or waive the finding on the choice. A match choice takes
        no annotation, so use the comment form on the choice's line:
        `// pssparser waive overlapping-activity-match: <reason>`.
      lrm: ["11.4.6"]
      match: { kind: ActivityMatch }
      define:
        overlap(a, b): >-
          ranges(a.node).value().exists(x,
            ranges(b.node).value().exists(y, x.lo <= y.hi && y.lo <= x.hi))
        first_overlap(n): >-
          known.filter(b, b.body == n).map(b,
            known.filter(a, a.index < b.index && overlap(a, b))[0])[0]
      let:
        known: branches(node).filter(b, !b.is_default && ranges(b.node).hasValue())
      report: >-
        known.filter(b, known.exists(a, a.index < b.index && overlap(a, b))).map(b, b.body)
      examples:
        - name: overlapping ranges, folded constants and a single value
          code: |
            component pss_top {
              static const int K = 4;
              action Sub { }
              action A {
                rand bit[4] m;
                activity {
                  match (m) {
                    [0..4]: do Sub;
                    [3..7]: do Sub;       // expect: LINT203
                    [K + 4]: do Sub;
                    [8, 12]: do Sub;      // expect: LINT203
                    default: do Sub;
                  }
                }
              }
            }
        - name: disjoint choices, and one that does not fold
          code: |
            component pss_top {
              action Sub { }
              action A {
                rand bit[4] m;
                rand bit[4] n;
                activity {
                  match (m) {
                    [0..3]: do Sub;
                    [4..7]: do Sub;
                    [n]: do Sub;
                    default: do Sub;
                  }
                }
              }
            }

    - id: LINT204
      name: identical-select-branches
      summary: A select branch written the same as an earlier branch
      message: >-
        this branch is the same as the branch on line ${string(first_same(finding).body.location.lineno)},
        which doubles that branch's chance of being selected
      doc: |
        Two `select` branches with the same guard, weight and statement are
        one branch with twice the weight (11.4.4 d). That is usually a
        copy-and-paste slip: the copy was meant to traverse a different
        action, or to constrain it differently.

        Branches are compared as code, not as text: layout and comments do
        not matter, while any difference in a name, an operator or a
        literal does.

        To weight a branch on purpose, say so with a weight, `[2]: do A;`,
        rather than by repeating it.
      lrm: ["11.4.4"]
      match: { kind: ActivitySelect }
      define:
        first_same(n): >-
          real.filter(b, b.body == n).map(b,
            real.filter(a, a.index < b.index && same_tree(a.node, b.node))[0])[0]
      let:
        real: branches(node)
      report: >-
        real.filter(b, real.exists(a, a.index < b.index && same_tree(a.node, b.node)))
          .map(b, b.body)
      examples:
        - name: a repeated branch, across lines and comments
          code: |
            component pss_top {
              action Sub { rand bit[4] x; }
              action A {
                activity {
                  select {
                    do Sub with { x < 5; }
                    do Sub with { x > 9; }
                    do Sub with {                   // expect: LINT204
                      x < 5;  // the same as the first
                    }
                  }
                }
              }
            }
        - name: different weights, guards or constraints, and an explicit weight
          code: |
            component pss_top {
              action Sub { rand bit[4] x; }
              action A {
                rand bit[4] m;
                activity {
                  select {
                    [2]: do Sub with { x < 5; }
                    [1]: do Sub with { x < 5; }
                    (m > 1): do Sub;
                    (m > 2): do Sub;
                    do Sub with { x < 6; }
                  }
                }
              }
            }

    - id: LINT205
      name: unused-action-handle
      summary: An action handle that is never traversed or referenced
      message: "action handle ${node} is never traversed or referenced, so it never runs"
      doc: |
        An action handle (a field of an action type, or an array of them)
        does nothing until an activity traverses it. One that nothing
        traverses, binds, constrains or otherwise names is usually a
        forgotten traversal, or left over after the activity changed.

        Uses are counted across the whole model: a traversal in a derived
        action's activity, in an `extend`, or in another file counts.
        Handles declared in files that are not being checked (a library, an
        `--include` path) are not reported.

        To keep a handle that is deliberately unused, remove it, or waive
        the finding on its declaration:
        `@lint_pkg::waive {.id = "unused-action-handle", .reason = "..."}`.
      lrm: ["11.3.1", "11.3.2"]
      match: { kind: [Field, ActionHandleField] }
      define:
        is_action(t): >-
          type(t) == DataTypeUserDefined && type_decl(t).hasValue()
            && type_decl(t).value().isa(Action)
      let:
        dt: >-
          node.isa(Field) ? node.type : node.isa(ActionHandleField) ? node.type : null
      where: >-
        is_owned(node) && (is_action(dt) || descendants(dt, DataTypeUserDefined).exists(t, is_action(t)))
          && size(refs(node)) == 0
      examples:
        - name: an untraversed handle, a handle array, and one declared in the activity
          code: |
            component pss_top {
              action Sub { }
              action A {
                Sub used;
                Sub spare;              // expect: LINT205
                Sub pool_of[2];         // expect: LINT205
                activity {
                  Sub local;            // expect: LINT205
                  used;
                }
              }
            }
        - name: uses in a constraint, a derived action and an extension
          code: |
            component pss_top {
              action Sub { rand bit[4] x; }
              action Base {
                Sub a;
                Sub b;
                Sub c;
                constraint a.x < 4;
              }
              action Derived : Base {
                activity { a; b; }
              }
              extend action Base {
                activity { c; }
              }
            }
