pss-rules:
  defaults:
    tier: style
  define:
    is_eq(n): n.op == ExprBinOp.BinOp_Eq
    broken(n): n.op +
    same: 1
  rules:
    - id: ACME001
      name: uses-a-file-helper
      summary: s
      message: m
      match: { kind: ExprBin }
      where: is_eq(node)
    - id: ACME002
      name: shadows-a-file-helper
      summary: s
      message: m
      match: { kind: ExprBin }
      define:
        is_eq(n): n.op == ExprBinOp.BinOp_Ne
      where: is_eq(node)
    - id: ACME003
      name: uses-the-broken-helper
      summary: s
      message: m
      match: { kind: ExprBin }
      where: broken(node) > 0
    - id: ACME004
      name: also-uses-it
      summary: s
      message: m
      match: { kind: ExprBin }
      where: broken(node) > 1
    - id: ACME005
      name: bad-helper-head
      summary: s
      message: m
      match: { kind: ExprBin }
      define:
        "f(": 1

