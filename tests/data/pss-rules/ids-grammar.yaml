# The marker ID grammar (format §5.1): NS000 or ORG-TEAM000, letters-only
# segments of 2-5 capitals, then exactly 3 digits.
pss-rules:
  defaults:
    tier: style
  rules:
    - id: ACME-NET001
      name: team-qualified
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACME-DMA104
      name: another-team
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACME-TEAM1001
      name: digit-in-team
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: acme002
      name: lower-case
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACME02
      name: two-digits
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACMEINC001
      name: long-org
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACME-NET-RX001
      name: two-qualifiers
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: 1001
      name: a-number
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACME003
      name: bad-alias
      aliases: [ACME-NET1]
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACME004
      name: replaced-by-a-reserved-id
      status: deprecated
      replaced_by: [LINT201]
      summary: s
      message: m
      match: { kind: ExprBin }

