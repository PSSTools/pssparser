# builtin
pss-rules:
  defaults:
    tier: style
  rules:
    - id: LINT901
      name: missing-builtin-fields
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: LINT902
      name: only-firing-examples
      family: exec
      summary: s
      message: m
      doc: d
      match: { kind: ExprBin }
      examples:
        - code: |
            component pss_top { }   // expect: LINT902
    - id: LINT903
      name: complete-builtin
      family: exec
      summary: s
      message: m
      doc: d
      match: { kind: ExprBin }
      examples:
        - name: fires
          code: |
            component pss_top { }   // expect: LINT903
        - name: near miss
          code: |
            component pss_top { }

