# expect: PSSP217 error @ 23:11 'PSSX001' is in the reserved namespace 'PSSX': PSS, PSSP, PSSX and LINT belong to pssparser, with or without a team qualifier; choose a namespace of your own, as ACME001
# expect: PSSP217 error @ 28:11 'PSS-ACME001' is in the reserved namespace 'PSS-ACME': PSS, PSSP, PSSX and LINT belong to pssparser, with or without a team qualifier; choose a namespace of your own, as ACME001
