# IDs (with aliases) and names are each unique across everything loaded
# (format §5). A team namespace is its own namespace (§5.1): ACME-NET001 and
# ACME-DMA001 do not clash, and neither clashes with ACME001. A rule that
# clashes claims nothing, so ACME006 may use the name ACME001's twin wanted.
pss-rules:
  defaults:
    tier: style
  rules:
    - id: ACME001
      name: first
      aliases: [ACME901]
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACME-NET001
      name: net-first
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACME-DMA001
      name: dma-first
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACME001
      name: same-id
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACME002
      name: first
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACME003
      name: alias-is-an-id
      aliases: [ACME-NET001]
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACME901
      name: id-is-an-alias
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACME004
      name: alias-is-own-id
      aliases: [ACME004]
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACME005
      name: net-first
      aliases: [ACME-DMA001]
      summary: s
      message: m
      match: { kind: ExprBin }
    - id: ACME006
      name: same-id
      summary: s
      message: m
      match: { kind: ExprBin }

