pss-rules:
  defaults:
    tier: style
  rules:
    - id: ACME001
      name: where-syntax
      summary: s
      message: m
      match: { kind: ExprBin }
      where: >-
        node.op == ExprBinOp.BinOp_Eq &&
        node.lhs ==
    - id: ACME002
      name: message-unterminated
      summary: s
      message: "the value ${node.op is wrong"
      match: { kind: ExprBin }
    - id: ACME003
      name: message-syntax
      summary: s
      message: "the value ${node.op +} is wrong"
      match: { kind: ExprBin }
    - id: ACME004
      name: outside-profile
      summary: s
      message: m
      match: { kind: ExprBin }
      where: node.op == uint(1)
    - id: ACME005
      name: let-syntax
      summary: s
      message: m
      match: { kind: ExprBin }
      let:
        a: "[1, 2"
    - id: ACME006
      name: message-empty
      summary: s
      message: "nothing ${ } here"
      match: { kind: ExprBin }

